<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书选品分析报告</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#c9d1d9;padding:20px}
.c{max-width:1600px;margin:0 auto}
h1{color:#ff4757;font-size:28px;margin-bottom:5px}
.sub{color:#8b949e;font-size:14px;margin-bottom:30px}
.s{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;margin-bottom:20px}
.st{color:#58a6ff;font-size:18px;font-weight:bold;margin-bottom:15px;border-bottom:1px solid #30363d;padding-bottom:8px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sc{background:#21262d;border-radius:8px;padding:12px;text-align:center}
.sc .v{font-size:22px;font-weight:bold;color:#ff4757}
.sc .l{font-size:11px;color:#8b949e;margin-top:4px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cb{background:#21262d;border-radius:8px;padding:15px}
.ct{color:#c9d1d9;font-size:14px;font-weight:bold;margin-bottom:10px}
.br{display:flex;align-items:center;margin-bottom:3px}
.bl{width:60px;font-size:11px;text-align:right;padding-right:6px;color:#8b949e;flex-shrink:0}
.bt{flex:1;height:16px;background:#30363d;border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px;transition:width .3s}
.bv{width:45px;font-size:11px;padding-left:6px;color:#c9d1d9;flex-shrink:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#21262d;color:#58a6ff;padding:7px 5px;text-align:left;position:sticky;top:0;z-index:1;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{background:#30363d}
th .arrow{font-size:10px;margin-left:3px;opacity:.5}
th.sorted .arrow{opacity:1;color:#ff4757}
td{padding:5px;border-bottom:1px solid #21262d;white-space:nowrap}
tr:hover{background:#1c2128}
.n{text-align:right;font-variant-numeric:tabular-nums}
.hl{color:#ff4757;font-weight:bold}
.hl2{color:#ffa502;font-weight:bold}
.tc{max-width:240px;overflow:hidden;text-overflow:ellipsis;cursor:default}
.tc:hover{white-space:normal;word-break:break-all;background:#1c2128;position:relative;z-index:2}
.kc{max-width:110px;overflow:hidden;text-overflow:ellipsis}
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;margin:2px;background:#21262d;color:#8b949e}
.tag.hot{background:#ff475720;color:#ff4757}
.sb{margin-bottom:12px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.sb input{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:7px 10px;border-radius:4px;width:260px;font-size:13px}
.sb input:focus{outline:none;border-color:#58a6ff}
.pf button{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.pf button.a{border-color:#58a6ff;color:#58a6ff}
.pf button:hover{border-color:#58a6ff}
.pager{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b949e;margin-bottom:8px}
.pager button{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.pager button:disabled{opacity:.4;cursor:default}
.pager select{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:3px 6px;border-radius:4px;font-size:11px}
.tc-wrap{max-height:70vh;overflow-y:auto;border-radius:4px}
.ins{background:#21262d;border-left:3px solid #ff4757;padding:10px 14px;margin-bottom:8px;border-radius:0 4px 4px 0}
.ins .it{color:#ff4757;font-weight:bold;font-size:13px;margin-bottom:4px}
.ins .ix{color:#c9d1d9;font-size:12px;line-height:1.6}
.loading{text-align:center;padding:40px;color:#8b949e;font-size:16px}
.export-btn{background:#238636;border:1px solid #2ea043;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:8px}
.export-btn:hover{background:#2ea043}
.tab-nav{display:flex;border-bottom:2px solid #30363d;margin-bottom:0;gap:0}
.tab-nav button{background:transparent;border:none;color:#8b949e;padding:10px 24px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-nav button:hover{color:#c9d1d9}
.tab-nav button.active{color:#ff4757;border-bottom-color:#ff4757;font-weight:bold}
.tab-panel{display:none}
.tab-panel.active{display:block}
.tab-nav button.tab-virtual.active{color:#a371f7;border-bottom-color:#a371f7}
.tab-nav button.tab-physical.active{color:#3fb950;border-bottom-color:#3fb950}
.type-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:bold}
.type-tag.virtual{background:#a371f720;color:#a371f7}
.type-tag.physical{background:#3fb95020;color:#3fb950}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
.guide-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:12px}
.guide-full{margin-bottom:12px}
.guide-box{background:#21262d;border-radius:8px;padding:14px}
.guide-box h3{color:#58a6ff;font-size:14px;margin-bottom:10px}
.guide-box h4{color:#c9d1d9;font-size:13px;margin:12px 0 8px}
.guide-principle{background:#161b22;border-left:3px solid #58a6ff;padding:12px 14px;border-radius:0 6px 6px 0;font-size:12px;line-height:1.8;color:#c9d1d9;margin-bottom:12px}
.guide-table{width:100%;font-size:11px;border-collapse:collapse}
.guide-table th{background:#161b22;color:#8b949e;padding:6px 8px;text-align:left;font-weight:600;border-bottom:1px solid #30363d}
.guide-table td{padding:6px 8px;border-bottom:1px solid #30363d;vertical-align:top;line-height:1.5}
.guide-table td:first-child{color:#ffa502;font-weight:bold;white-space:nowrap}
.guide-table .ref{color:#00d4aa}
.guide-steps{display:flex;flex-direction:column;gap:10px}
.guide-step{background:#161b22;border-left:3px solid #00d4aa;padding:10px 12px;border-radius:0 6px 6px 0;font-size:12px;line-height:1.6}
.guide-step .sn{color:#00d4aa;font-weight:bold;margin-right:6px}
.guide-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.guide-pool span{font-size:11px;padding:4px 10px;border-radius:4px;background:#161b22;border:1px solid #30363d;line-height:1.5}
.guide-priority{margin:0;padding-left:18px;font-size:12px;line-height:1.9;color:#c9d1d9}
.guide-priority li{margin-bottom:2px}
.guide-grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guide-grade-card{background:#161b22;border-radius:6px;padding:10px 12px;border-top:3px solid #888}
.guide-grade-card .gh{font-size:15px;font-weight:bold;margin-bottom:6px}
.guide-grade-card .gl{font-size:11px;color:#8b949e;margin-bottom:6px}
.guide-grade-card ul{margin:0;padding-left:16px;font-size:11px;line-height:1.6;color:#c9d1d9}
.guide-grade-card .ga{font-size:11px;color:#58a6ff;margin-top:6px;font-style:italic}
.guide-list{margin:0;padding-left:18px;font-size:12px;line-height:1.7;color:#c9d1d9}
.guide-list li{margin-bottom:4px}
.guide-band-table td,.guide-band-table th{font-size:11px}
.guide-routine{background:#ff475710;border:1px solid #ff475730;border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.7;color:#c9d1d9;margin-top:10px}
.guide-routine b{color:#ff4757}
tr.anomaly-row{background:#ffa50212}
tr.anomaly-row:hover{background:#ffa50220}
td.anomaly-cell{color:#ffa502!important;font-weight:bold}
td.na{color:#6e7681}
</style>
</head>
<body>
<div class="c">
<h1>小红书选品分析报告</h1>
<div class="sub" id="subtitle">加载中...</div>
<div id="loading" class="loading">正在加载数据...</div>
<div id="content" style="display:none">

<div class="s"><div class="st">核心指标</div><div class="sg" id="stats"></div></div>
<div class="s"><div class="st">字段说明与选品指南</div><div id="guide"></div></div>
<div class="s"><div class="st">选品洞察</div><div id="insights"></div></div>
<div class="s"><div class="st">数据分布</div><div class="cg" id="charts"></div></div>
<div class="s"><div class="st">热门关键词 TOP20</div><div id="keywords" style="display:flex;flex-wrap:wrap;gap:4px"></div></div>
<div class="s"><div class="st">高频店铺 TOP20</div><div id="stores" style="display:flex;flex-wrap:wrap;gap:4px"></div></div>

<div class="s" style="padding-bottom:0">
<div class="tab-nav">
<button class="active tab-virtual" onclick="switchTab('virtual',this)">虚拟商品<span class="tab-count" id="countVirtual"></span></button>
<button class="tab-physical" onclick="switchTab('physical',this)">实体商品<span class="tab-count" id="countPhysical"></span></button>
</div>
</div>

<div class="s tab-panel active" id="panel-virtual">
<div class="sb">
<input type="text" id="si-virtual" placeholder="搜索虚拟商品/店铺/关键词..." oninput="filterVirtual()">
<div class="pf" id="pf-virtual">
<button class="a" onclick="fp('ALL','virtual',this)">全部</button>
<button onclick="fp('BURST','virtual',this)">BURST</button>
<button onclick="fp('ACCEL','virtual',this)">ACCEL</button>
<button onclick="fp('WATCH','virtual',this)">WATCH</button>
<button onclick="fp('NEW','virtual',this)">NEW</button>
</div>
<button class="export-btn" onclick="exportCSV('virtual')">导出CSV</button>
</div>
<div class="pager" id="pager-virtual"></div>
<div class="tw"><div class="tc-wrap"><table><thead><tr id="thead-virtual"></tr></thead><tbody id="tbody-virtual"></tbody></table></div></div>
</div>

<div class="s tab-panel" id="panel-physical">
<div class="sb">
<input type="text" id="si-physical" placeholder="搜索实体商品/店铺/关键词..." oninput="filterPhysical()">
<div class="pf" id="pf-physical">
<button class="a" onclick="fp('ALL','physical',this)">全部</button>
<button onclick="fp('BURST','physical',this)">BURST</button>
<button onclick="fp('ACCEL','physical',this)">ACCEL</button>
<button onclick="fp('WATCH','physical',this)">WATCH</button>
<button onclick="fp('NEW','physical',this)">NEW</button>
</div>
<button class="export-btn" onclick="exportCSV('physical')">导出CSV</button>
</div>
<div class="pager" id="pager-physical"></div>
<div class="tw"><div class="tc-wrap"><table><thead><tr id="thead-physical"></tr></thead><tbody id="tbody-physical"></tbody></table></div></div>
</div>

</div>
</div>
<script src="data.js"></script>
<script>
(function(){
if(typeof REPORT_DATA==='undefined'){
document.getElementById('loading').textContent='数据加载失败: data.js 文件未找到';
return;
}

var D=REPORT_DATA;
var m=D.meta;
var COLS=D.columns;
var IDX={};
COLS.forEach(function(c,i){ IDX[c]=i; });

var HAS_DB_VIRTUAL=typeof IDX.is_virtual!=='undefined';
var HAS_VSR_CHART=!!(D.charts&&D.charts.vsr);
var VIRTUAL_KEYWORDS=['自动发货','电子版','PDF','秒发','课件','教案','模板','word','PPT','ppt','题库','真题','答案','解析','密钥','激活','优惠券','兑换券','月卡','会员','视频课程','网课','资料包','网盘','刻录盘'];
function isVirtualByKeyword(title){ return VIRTUAL_KEYWORDS.some(function(kw){ return title.toLowerCase().includes(kw.toLowerCase()); }); }

function buildItem(r){
var v1d=parseFloat(r[IDX.v1d])||0;
var sold=parseInt(r[IDX.sold])||0;
var actualRaw=typeof IDX.actual_v1d!=='undefined'?r[IDX.actual_v1d]:null;
var actualV1d=(actualRaw===null||actualRaw===undefined||actualRaw==='')?null:parseFloat(actualRaw);
var actualGrRaw=typeof IDX.actual_gr!=='undefined'?r[IDX.actual_gr]:null;
var actualGr=(actualGrRaw===null||actualGrRaw===undefined||actualGrRaw==='')?null:parseFloat(actualGrRaw);
var grSnap=parseFloat(r[IDX.gr])||0;
var estVsr=typeof IDX.vsr!=='undefined'?(parseFloat(r[IDX.vsr])||0):(sold>0?v1d/sold:0);
var actualVsrRaw=typeof IDX.actual_vsr!=='undefined'?r[IDX.actual_vsr]:null;
var actualVsr=(actualVsrRaw===null||actualVsrRaw===undefined||actualVsrRaw==='')?null:parseFloat(actualVsrRaw);
if(actualVsr===null&&actualV1d!==null&&sold>0) actualVsr=actualV1d/sold;
var estVsrPct=estVsr*100;
var actualVsrPct=actualVsr!==null?actualVsr*100:null;
var anomaly=typeof IDX.anomaly!=='undefined'?parseInt(r[IDX.anomaly],10)===1:((sold>0&&v1d>sold)||estVsrPct>100);
return {
gid:r[IDX.goods_id]||'',
title:r[IDX.title]||'',
price:r[IDX.price],
sold:sold,
v1h:parseFloat(r[IDX.v1h])||0,
v6h:parseFloat(r[IDX.v6h])||0,
actualV1d:actualV1d,
v1d:v1d,
actualGr:actualGr,
gr:grSnap,
actualVsr:actualVsr,
actualVsrPct:actualVsrPct,
estVsr:estVsr,
estVsrPct:estVsrPct,
acc:parseFloat(r[IDX.acc])||0,
burst:parseFloat(r[IDX.burst])||0,
pool:r[IDX.pool]||'',
firstSeen:r[IDX.first_seen]||'',
storeId:r[IDX.store_id]||'',
storeName:r[IDX.store_name]||'',
shelfTime:r[IDX.shelf_time]||'',
fansCount:parseInt(r[IDX.fans_count])||0,
shopSales:r[IDX.shop_sales]||'',
shopFans:r[IDX.shop_fans]||'',
behavior:r[IDX.behavior]||'',
isVirtual:parseInt(r[IDX.is_virtual],10)===1,
anomaly:anomaly
};
}

var ALL_ITEMS=[];
var PHYSICAL_ITEMS=[];
var VIRTUAL_ITEMS=[];
D.items.forEach(function(r){
var v1d=parseFloat(r[IDX.v1d])||0;
if(v1d>0){
var obj=buildItem(r);
ALL_ITEMS.push(obj);
if(obj.isVirtual) VIRTUAL_ITEMS.push(obj);
else PHYSICAL_ITEMS.push(obj);
}
});

function initSort(arr,col,desc){
arr.sort(function(a,b){
var va=a[col],vb=b[col];
if(col==='actualV1d'||col==='actualGr'||col==='actualVsrPct'){
va=(va===null||va===undefined||isNaN(va))?-1:va;
vb=(vb===null||vb===undefined||isNaN(vb))?-1:vb;
}
if(typeof va==='number') return desc?(vb-va):(va-vb);
if(typeof va==='string') va=va.toLowerCase();
if(typeof vb==='string') vb=vb.toLowerCase();
return desc?(vb>va?1:vb<va?-1:0):(va>vb?1:va<vb?-1:0);
});
}
initSort(VIRTUAL_ITEMS,'actualV1d',true);
initSort(PHYSICAL_ITEMS,'actualV1d',true);

function fmtNum(n){ return n.toLocaleString(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('loading').style.display='none';
document.getElementById('content').style.display='block';
var dedupNote=m.deduped===false?' | 未去重':' | 同标题变体已去重';
var classifyNote=m.classify_rule==='strict_no_shipping'?' | 虚拟=无需物流':'';
var rawNote=m.count_raw?' (原始'+fmtNum(m.count_raw)+'条)':'';
document.getElementById('subtitle').textContent='报告时间: '+m.time+' | 预估日增量>0商品 '+fmtNum(m.count)+rawNote+dedupNote+classifyNote+' | 总商品库: '+fmtNum(m.total_goods)+(m.yesterday_date?' | 实际增量基准日: '+m.yesterday_date:'');

document.getElementById('countPhysical').textContent='('+fmtNum(PHYSICAL_ITEMS.length)+')';
document.getElementById('countVirtual').textContent='('+fmtNum(VIRTUAL_ITEMS.length)+')';

var avgEstVsr=ALL_ITEMS.length>0?(ALL_ITEMS.reduce(function(s,i){return s+i.estVsrPct;},0)/ALL_ITEMS.length).toFixed(2):'0';
var avgActualVsr=m.avg_actual_vsr?((m.avg_actual_vsr*100).toFixed(2)+'%'):'—';
var anomalyCount=m.anomaly_count||ALL_ITEMS.filter(function(i){return i.anomaly;}).length;
document.getElementById('stats').innerHTML=[
['活跃商品总数',m.active_goods,''],
['预估日增量>0',m.count,'#00d4aa'],
['实体商品',PHYSICAL_ITEMS.length,'#3fb950'],
['虚拟商品',VIRTUAL_ITEMS.length,'#a371f7'],
['平均价格','\u00a5'+m.avg_price,'#58a6ff'],
['中位价格','\u00a5'+m.median_price,'#58a6ff'],
['平均实际增量',(m.avg_actual_v1d||0)+'','#00d4aa'],
['平均实际日增速',(m.avg_actual_gr||0)+'%','#00d4aa'],
['平均实际增销比',avgActualVsr,'#00d4aa'],
['平均预估增销比',(m.avg_vsr?((m.avg_vsr*100).toFixed(2)+'%'):avgEstVsr+'%'),''],
['数据异常(标黄)',anomalyCount,'#ffa502'],
['NEW',m.pool_new,'#00d4aa'],
['WATCH',m.pool_watch,'#888'],
['ACCEL',m.pool_accel,'#ffa502'],
['BURST',m.pool_burst,'#ff4757']
].map(function(x){return '<div class="sc"><div class="v" style="color:'+(x[2]||'#ff4757')+'">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>';}).join('');

var guide=m.selection_guide||D.selection_guide||{};
var fields=m.field_guide||D.field_guide||[];

function renderGuide(){
var g=guide;
var h='';
var wf=g.workflow||g.steps||[];

if(!wf.length&&!fields.length){
return '<div class="guide-principle" style="border-left-color:#ffa502;color:#ffa502">指南内容未加载。请运行 <code>python gen_report.py</code> 生成最新 data.js 后刷新页面。</div>';
}

if(g.principle){
h+='<div class="guide-principle"><b style="color:#58a6ff">核心原则：</b>'+g.principle+'</div>';
}

h+='<div class="guide-grid">';
h+='<div class="guide-box"><h3>'+(g.title||'统一选品标准')+' · 五步工作流</h3><div class="guide-steps">';
wf.forEach(function(s){
h+='<div class="guide-step"><span class="sn">'+s.step+'</span><b>'+s.name+'</b> — '+s.text+'</div>';
});
h+='</div>';
if(g.daily_routine) h+='<div class="guide-routine"><b>每日例行：</b>'+g.daily_routine+'</div>';
if(g.filters) h+='<div style="margin-top:10px;font-size:11px;color:#8b949e">'+g.filters+'</div>';
h+='</div>';

h+='<div class="guide-box"><h3>字段阅读顺序</h3><ol class="guide-priority">';
(g.priority_fields||[]).forEach(function(p){h+='<li>'+p+'</li>';});
h+='</ol>';
if(g.pool_tips){
h+='<h4>分层含义</h4><div class="guide-pool">';
for(var pk in g.pool_tips){h+='<span><b style="color:#ff4757">'+pk+'</b> '+g.pool_tips[pk]+'</span>';}
h+='</div>';
}
h+='</div></div>';

if(g.grade_criteria&&g.grade_criteria.length){
h+='<div class="guide-full"><div class="guide-box"><h3>S / A / B / C 评级标准（统一参考）</h3><div class="guide-grade">';
g.grade_criteria.forEach(function(gc){
h+='<div class="guide-grade-card" style="border-top-color:'+(gc.color||'#888')+'">';
h+='<div class="gh" style="color:'+(gc.color||'#c9d1d9')+'">'+gc.grade+' 级 · '+gc.label+'</div>';
h+='<ul>';
(gc.conditions||[]).forEach(function(c){h+='<li>'+c+'</li>';});
h+='</ul>';
if(gc.action) h+='<div class="ga">→ '+gc.action+'</div>';
h+='</div>';
});
h+='</div></div></div>';
}

if(g.track_tips){
h+='<div class="guide-grid">';
var vt=g.track_tips.virtual, pt=g.track_tips.physical;
if(vt){
h+='<div class="guide-box"><h3 style="color:#a371f7">'+(vt.title||'虚拟品')+'</h3><ul class="guide-list">';
(vt.items||[]).forEach(function(i){h+='<li>'+i+'</li>';});
h+='</ul></div>';
}
if(pt){
h+='<div class="guide-box"><h3 style="color:#3fb950">'+(pt.title||'实体品')+'</h3><ul class="guide-list">';
(pt.items||[]).forEach(function(i){h+='<li>'+i+'</li>';});
h+='</ul></div>';
}
h+='<div class="guide-box"><h3 style="color:#ffa502">风险警示</h3><ul class="guide-list">';
(g.red_flags||[]).forEach(function(r){h+='<li>'+r+'</li>';});
h+='</ul></div></div>';
}

if(g.price_bands&&g.price_bands.length){
h+='<div class="guide-full"><div class="guide-box"><h3>价格带选品参考</h3><table class="guide-table guide-band-table"><thead><tr><th>价格带</th><th>虚拟品</th><th>实体品</th></tr></thead><tbody>';
g.price_bands.forEach(function(b){
h+='<tr><td>'+b.range+'</td><td>'+b.virtual+'</td><td>'+b.physical+'</td></tr>';
});
h+='</tbody></table></div></div>';
}

h+='<div class="guide-full"><div class="guide-box"><h3>全字段字典（含义 · 计算 · 选品参考）</h3><table class="guide-table"><thead><tr><th>字段</th><th>计算方式</th><th>含义说明</th><th>选品参考</th></tr></thead><tbody>';
fields.forEach(function(f){
h+='<tr><td>'+f.field+'</td><td style="color:#8b949e">'+(f.formula||'—')+'</td><td>'+(f.desc||'')+'</td><td class="ref">'+(f.reference||'—')+'</td></tr>';
});
h+='</tbody></table>';
h+='<div style="margin-top:10px;font-size:11px;color:#ffa502">标黄行规则：预估日增量>销量 或 预估增销比>100%。决策时永远以「实际增量 / 实际日增速 / 实际增销比」三列为最终依据。</div>';
h+='</div></div>';

return h;
}
document.getElementById('guide').innerHTML=renderGuide();

var ch=D.charts;
var hiGr=0,hiV1d=0,lowP=0;
for(var k in ch.gr){if(['20-50%','50-100%','>100%'].indexOf(k)>=0)hiGr+=ch.gr[k];}
for(var k in ch.v1d){if(['20-50','50-100','>100'].indexOf(k)>=0)hiV1d+=ch.v1d[k];}
lowP=ch.price['0-30']+ch.price['30-50'];

document.getElementById('insights').innerHTML=[
['日增量口径','「实际增量」= 当前销量 − 昨日('+((m.yesterday_date)||'前一日')+')快照，真实观测值。「预估日增量」= 按最近4h+快照外推至24h，用于发现加速中的品。'],
['日增量覆盖率','活跃商品 '+fmtNum(m.active_goods)+' 中预估日增量>0的商品 '+fmtNum(m.count)+' 个，覆盖率 '+(m.count/m.active_goods*100).toFixed(1)+'%。实体 '+fmtNum(PHYSICAL_ITEMS.length)+' 个，虚拟 '+fmtNum(VIRTUAL_ITEMS.length)+' 个。'],
['价格带分析','日增量>0商品平均价格 \u00a5'+m.avg_price+'，中位价格 \u00a5'+m.median_price+'。'+(lowP>m.count*0.4?'低价(0-50元)占比高，适合走量策略':'中高价格带活跃，适合利润选品')+'。'],
['增长趋势','日增速>20%的商品 '+hiGr+' 个，预估日增量>20的有 '+hiV1d+' 个。平均实际增量 '+(m.avg_actual_v1d||0)+'，异常标黄 '+anomalyCount+' 条需人工复核。'],
['爆发品识别','BURST分层 '+fmtNum(m.pool_burst)+' 个，ACCEL分层 '+fmtNum(m.pool_accel)+' 个。建议：先筛 BURST/ACCEL → 按实际增量排序 → 排除标黄异常行。']
].map(function(x){return '<div class="ins"><div class="it">'+x[0]+'</div><div class="ix">'+x[1]+'</div></div>';}).join('');

function barC(d,c){
var mx=0;for(var k in d){if(d[k]>mx)mx=d[k];}
var h='';
for(var k in d){h+='<div class="br"><span class="bl">'+k+'</span><div class="bt"><div class="bf" style="width:'+(d[k]/mx*100)+'%;background:'+c+'"></div></div><span class="bv">'+d[k]+'</span></div>';}
return h;
}

function buildVsrEstChart(){
if(ch.vsr_est) return ch.vsr_est;
var dist={'0-1%':0,'1-5%':0,'5-10%':0,'10-20%':0,'20-50%':0,'>50%':0};
ALL_ITEMS.forEach(function(item){
var p=item.estVsrPct;
var b='>50%';
if(p<=1)b='0-1%';else if(p<=5)b='1-5%';else if(p<=10)b='5-10%';else if(p<=20)b='10-20%';else if(p<=50)b='20-50%';
dist[b]++;
});
return dist;
}

document.getElementById('charts').innerHTML=[
['价格分布',ch.price,'#58a6ff'],
['销量分布',ch.sold,'#00d4aa'],
['预估日增量分布',ch.v1d,'#ff4757'],
['实际日增速分布',ch.gr,'#00d4aa'],
['实际增销比分布',ch.vsr,'#00d4aa'],
['预估增销比分布',buildVsrEstChart(),'#a371f7']
].map(function(x){return '<div class="cb"><div class="ct">'+x[0]+'</div>'+barC(x[1],x[2])+'</div>';}).join('');

document.getElementById('keywords').innerHTML=D.top_keywords.map(function(x){return '<span class="tag '+(x[1]>D.meta.count*0.02?'hot':'')+'">'+x[0]+' ('+x[1]+')</span>';}).join('');
document.getElementById('stores').innerHTML=D.top_stores.map(function(x){return '<span class="tag '+(x[1]>3?'hot':'')+'">'+x[0]+' ('+x[1]+')</span>';}).join('');

var POOL_C={'NEW':'#00d4aa','WATCH':'#888','ACCEL':'#ffa502','BURST':'#ff4757'};

var HEADERS=[
{key:'idx',label:'#',w:40,sort:false},
{key:'gid',label:'商品ID',w:80,sort:true},
{key:'title',label:'商品名称',w:240,sort:true,cls:'tc'},
{key:'price',label:'价格',w:65,sort:true,cls:'n',fmt:function(v){return '\u00a5'+v;}},
{key:'sold',label:'销量',w:70,sort:true,cls:'n',fmt:function(v){return fmtNum(v);}},
{key:'v1h',label:'1h增量',w:65,sort:true,cls:'n',fmt:function(v){return v.toFixed(1);}},
{key:'v6h',label:'6h增量',w:65,sort:true,cls:'n',fmt:function(v){return v.toFixed(1);}},
{key:'actualV1d',label:'实际增量',w:70,sort:true,cls:'n hl',fmt:function(v){if(v===null||v===undefined||isNaN(v))return '<span class="na">—</span>';return v.toFixed(1);}},
{key:'v1d',label:'预估日增量',w:75,sort:true,cls:'n',fmt:function(v,item){var cls=item&&item.anomaly?' anomaly-cell':'';return '<span class="'+cls.trim()+'">'+v.toFixed(1)+'</span>';}},
{key:'actualGr',label:'实际日增速',w:75,sort:true,cls:'n hl',fmt:function(v){if(v===null||v===undefined||isNaN(v))return '<span class="na">—</span>';return v.toFixed(2)+'%';}},
{key:'gr',label:'快照日增速',w:75,sort:true,cls:'n',fmt:function(v){return v.toFixed(2)+'%';}},
{key:'actualVsrPct',label:'实际增销比',w:75,sort:true,cls:'n hl',fmt:function(v,item){if(v===null||v===undefined||isNaN(v))return '<span class="na">—</span>';return v.toFixed(2)+'%';}},
{key:'estVsrPct',label:'预估增销比',w:75,sort:true,cls:'n hl2',fmt:function(v,item){var cls=item&&item.anomaly?' anomaly-cell':'';return '<span class="'+cls.trim()+'">'+v.toFixed(2)+'%'+'</span>';}},
{key:'acc',label:'加速度',w:60,sort:true,cls:'n',fmt:function(v){return v.toFixed(3);}},
{key:'burst',label:'爆发分',w:60,sort:true,cls:'n',fmt:function(v){return v.toFixed(1);}},
{key:'pool',label:'分层',w:55,sort:true},
{key:'storeName',label:'店铺名称',w:120,sort:true,cls:'kc'},
{key:'storeId',label:'店铺ID',w:80,sort:true},
{key:'shopSales',label:'店铺销量',w:80,sort:true},
{key:'shopFans',label:'店铺粉丝',w:80,sort:true},
{key:'fansCount',label:'粉丝数',w:70,sort:true,cls:'n',fmt:function(v){return v>0?fmtNum(v):'-';}},
{key:'behavior',label:'行为数据',w:160,sort:true,cls:'tc'},
{key:'firstSeen',label:'首次发现',w:80,sort:true},
{key:'shelfTime',label:'上架时间',w:90,sort:true}
];

var TABS={
physical:{items:PHYSICAL_ITEMS,filtered:null,sortCol:'actualV1d',sortDesc:true,page:0,pageSize:100,poolFilter:'ALL'},
virtual:{items:VIRTUAL_ITEMS,filtered:null,sortCol:'actualV1d',sortDesc:true,page:0,pageSize:100,poolFilter:'ALL'}
};

function getFiltered(tab){
var t=TABS[tab];
if(t.filtered) return t.filtered;
return t.items;
}

function renderHead(tab){
var t=TABS[tab];
var html='';
HEADERS.forEach(function(h){
var sorted=t.sortCol===h.key;
var arrow=sorted?(t.sortDesc?'\u25bc':'\u25b2'):'\u21c5';
var cls=sorted?'sorted':'';
html+='<th class="'+cls+'" onclick="doSort(\''+tab+'\',\''+h.key+'\')" style="width:'+h.w+'px">'+h.label+'<span class="arrow">'+arrow+'</span></th>';
});
document.getElementById('thead-'+tab).innerHTML=html;
}

function renderBody(tab){
var t=TABS[tab];
var items=getFiltered(tab);
var start=t.page*t.pageSize;
var end=Math.min(start+t.pageSize,items.length);
var pageData=items.slice(start,end);

var html='';
for(var i=0;i<pageData.length;i++){
var item=pageData[i];
var pool=item.pool;
var pc=POOL_C[pool]||'#888';
var title=item.title.length>40?item.title.substring(0,40)+'...':item.title;
var storeName=item.storeName.length>16?item.storeName.substring(0,16)+'...':item.storeName;
var behavior=item.behavior.length>30?item.behavior.substring(0,30)+'...':item.behavior;

var cells=[
start+i+1,
esc(item.gid),
'<span title="'+esc(item.title)+'">'+esc(title)+'</span>',
item.price,
item.sold,
item.v1h,
item.v6h,
item.actualV1d,
item.v1d,
item.actualGr,
item.gr,
item.actualVsrPct,
item.estVsrPct||0,
item.acc,
item.burst,
'<span style="color:'+pc+';font-weight:bold">'+pool+'</span>',
'<span title="'+esc(item.storeName)+'">'+esc(storeName)+'</span>',
esc(item.storeId),
esc(item.shopSales),
esc(item.shopFans),
item.fansCount,
'<span title="'+esc(item.behavior)+'">'+esc(behavior)+'</span>',
esc(item.firstSeen),
esc(item.shelfTime)
];

html+='<tr'+(item.anomaly?' class="anomaly-row"':'')+'>';
for(var ci=0;ci<cells.length;ci++){
var h=HEADERS[ci];
var cls=h.cls||'';
var val=ci>0?(h.fmt?h.fmt(cells[ci],item):cells[ci]):cells[ci];
html+='<td class="'+cls+'">'+val+'</td>';
}
html+='</tr>';
}
document.getElementById('tbody-'+tab).innerHTML=html;

var total=items.length;
var totalPages=Math.ceil(total/t.pageSize)||1;
document.getElementById('pager-'+tab).innerHTML=
'<button '+(t.page<=0?'disabled':'')+' onclick="goPage(\''+tab+'\',0)">首页</button>'+
'<button '+(t.page<=0?'disabled':'')+' onclick="goPage(\''+tab+'\','+(t.page-1)+')">上一页</button>'+
'<span>'+(start+1)+'-'+end+' / '+fmtNum(total)+'</span>'+
'<button '+(t.page>=totalPages-1?'disabled':'')+' onclick="goPage(\''+tab+'\','+(t.page+1)+')">下一页</button>'+
'<button '+(t.page>=totalPages-1?'disabled':'')+' onclick="goPage(\''+tab+'\','+(totalPages-1)+')">末页</button>'+
'<select onchange="changePageSize(\''+tab+'\',+this.value)">'+
'<option value="50" '+(t.pageSize===50?'selected':'')+'>50条/页</option>'+
'<option value="100" '+(t.pageSize===100?'selected':'')+'>100条/页</option>'+
'<option value="200" '+(t.pageSize===200?'selected':'')+'>200条/页</option>'+
'<option value="500" '+(t.pageSize===500?'selected':'')+'>500条/页</option>'+
'</select>';
}

function renderTab(tab){
renderHead(tab);
renderBody(tab);
}

window.switchTab=function(tab,btn){
document.querySelectorAll('.tab-nav button').forEach(function(b){b.classList.remove('active');});
btn.classList.add('active');
document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
document.getElementById('panel-'+tab).classList.add('active');
};

window.doSort=function(tab,col){
var t=TABS[tab];
if(t.sortCol===col){t.sortDesc=!t.sortDesc;}else{t.sortCol=col;t.sortDesc=true;}
var items=getFiltered(tab);
items.sort(function(a,b){
var va=a[col],vb=b[col];
if(col==='actualV1d'||col==='actualGr'||col==='actualVsrPct'){
va=(va===null||va===undefined||isNaN(va))?-1:va;
vb=(vb===null||vb===undefined||isNaN(vb))?-1:vb;
}
if(typeof va==='number') return t.sortDesc?(vb-va):(va-vb);
if(typeof va==='string') va=va.toLowerCase();
if(typeof vb==='string') vb=vb.toLowerCase();
return t.sortDesc?(vb>va?1:vb<va?-1:0):(va>vb?1:va<vb?-1:0);
});
t.page=0;
renderHead(tab);
renderBody(tab);
};

window.goPage=function(tab,p){
var t=TABS[tab];
var totalPages=Math.ceil(getFiltered(tab).length/t.pageSize)||1;
t.page=Math.max(0,Math.min(p,totalPages-1));
renderBody(tab);
};

window.changePageSize=function(tab,s){
TABS[tab].pageSize=s;
TABS[tab].page=0;
renderBody(tab);
};

window.fp=function(pool,tab,btn){
document.querySelectorAll('#pf-'+tab+' button').forEach(function(b){b.classList.remove('a');});
btn.classList.add('a');
TABS[tab].poolFilter=pool;
doFilter(tab);
};

function doFilter(tab){
var t=TABS[tab];
var q=document.getElementById('si-'+tab).value.toLowerCase();
t.filtered=t.items.filter(function(item){
if(t.poolFilter!=='ALL' && item.pool!==t.poolFilter) return false;
if(q){
return item.title.toLowerCase().includes(q) || item.storeName.toLowerCase().includes(q) || item.gid.toLowerCase().includes(q);
}
return true;
});
t.page=0;
renderBody(tab);
}

window.filterPhysical=function(){ doFilter('physical'); };
window.filterVirtual=function(){ doFilter('virtual'); };

window.exportCSV=function(tab){
var items=getFiltered(tab);
var typeName=tab==='physical'?'实体':tab==='virtual'?'虚拟':'全部';
var header='商品ID,商品名称,价格,销量,1h增量,6h增量,实际增量,预估日增量,实际日增速,快照日增速,实际增销比,预估增销比,加速度,爆发分,分层,店铺名称,店铺ID,店铺销量,店铺粉丝,粉丝数,行为数据,首次发现,上架时间,数据异常,类型';
var body=items.map(function(item){
return [
'"'+item.gid+'"',
'"'+item.title.replace(/"/g,'""')+'"',
item.price,
item.sold,
item.v1h.toFixed(1),
item.v6h.toFixed(1),
(item.actualV1d===null||isNaN(item.actualV1d)?'':item.actualV1d.toFixed(1)),
item.v1d.toFixed(1),
(item.actualGr===null||isNaN(item.actualGr)?'':item.actualGr.toFixed(2)+'%'),
item.gr.toFixed(2)+'%',
(item.actualVsrPct===null||isNaN(item.actualVsrPct)?'':item.actualVsrPct.toFixed(2)+'%'),
item.estVsrPct.toFixed(2)+'%',
item.acc.toFixed(3),
item.burst.toFixed(1),
item.pool,
'"'+item.storeName.replace(/"/g,'""')+'"',
'"'+item.storeId+'"',
'"'+item.shopSales+'"',
'"'+item.shopFans+'"',
item.fansCount,
'"'+item.behavior.replace(/"/g,'""')+'"',
'"'+item.firstSeen+'"',
'"'+item.shelfTime+'"',
item.anomaly?'是':'否',
item.isVirtual?'虚拟':'实体'
].join(',');
}).join('\n');
var blob=new Blob(['\uFEFF'+header+'\n'+body],{type:'text/csv;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download='选品数据_'+m.date+'_'+typeName+'.csv';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
};

renderTab('virtual');
renderTab('physical');

})();
</script>
</body>
</html>
