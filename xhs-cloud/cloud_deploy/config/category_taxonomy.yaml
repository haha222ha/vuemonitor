# V2 情报类目树（标题关键词 → 赛道 / 子类）
# 匹配顺序：从上到下，首个命中生效；均未命中 → fallback
version: "taxonomy-v1"
fallback:
  category: 综合类目
  sub_category: 其他

rules:
  - pattern: "小学|语文|数学|英语|教辅|暑假|衔接|口算|练字|试卷"
    category: 小学教辅
    sub_category: K12
  - pattern: "幼儿园|早教|绘本|识字|拼音"
    category: 幼教启蒙
    sub_category: K12
  - pattern: "美甲|穿戴甲|甲片|甲油"
    category: 美甲美睫
    sub_category: 美业
  - pattern: "假睫毛|美睫|眼线"
    category: 美甲美睫
    sub_category: 美业
  - pattern: "收纳|置物|整理|储物|衣架|挂钩"
    category: 家居收纳
    sub_category: 家居
  - pattern: "宠物|猫粮|狗粮|猫砂|猫窝|狗窝"
    category: 宠物用品
    sub_category: 宠物
  - pattern: "面膜|护肤|精华|防晒|洁面|化妆"
    category: 美妆护肤
    sub_category: 美业
  - pattern: "口红|唇釉|粉底|眼影"
    category: 彩妆
    sub_category: 美业
  - pattern: "女装|连衣裙|半身裙|T恤|卫衣|外套"
    category: 女装
    sub_category: 服饰
  - pattern: "男装|男士|男款"
    category: 男装
    sub_category: 服饰
  - pattern: "童装|儿童|宝宝|婴儿"
    category: 童装母婴
    sub_category: 母婴
  - pattern: "手机壳|数据线|充电器|耳机|数码"
    category: 数码配件
    sub_category: 3C
  - pattern: "零食|坚果|咖啡|茶叶|代餐"
    category: 食品轻食
    sub_category: 食品
  - pattern: "露营|户外|登山|徒步|防晒衣"
    category: 户外露营
    sub_category: 户外
  - pattern: "文具|笔记本|中性笔|贴纸|手账"
    category: 文创文具
    sub_category: 文具
  - pattern: "玩具|积木|盲盒|手办"
    category: 潮玩玩具
    sub_category: 玩具
  - pattern: "健身|瑜伽|运动|跑步|球"
    category: 运动健身
    sub_category: 运动
  - pattern: "厨房|锅|碗|刀具|烘焙"
    category: 厨房用品
    sub_category: 家居
  - pattern: "床品|四件套|枕头|被子|毛巾"
    category: 家纺床品
    sub_category: 家居
  - pattern: "汽车|车载|车饰|雨刮"
    category: 车载用品
    sub_category: 汽车
  - pattern: "壁纸|海报|装饰|摆件|香薰"
    category: 家居软装
    sub_category: 家居
