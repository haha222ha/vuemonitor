<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报告在线预览</title>
<style>
:root{--bg:#0f1419;--bar:#161b22;--text:#e6edf3;--muted:#8b949e;--accent:#0071e3;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .title{font-size:13px;color:var(--muted);margin-right:auto;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:6px}
.seg button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#21262d;color:var(--text);font-size:12px;cursor:pointer}
.seg button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#21262d;color:var(--text);font-size:12px;cursor:pointer;text-decoration:none}
iframe{display:block;width:100%;height:calc(100vh - 45px);border:0;background:#fff}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="topbar">
  <span class="title" id="title">报告预览</span>
  <div class="seg" id="viewSeg">
    <button type="button" data-entry="index_vue.html" class="active" onclick="setEntry('index_vue.html')">Vue 列表</button>
    <button type="button" data-entry="index_with_gr.html" onclick="setEntry('index_with_gr.html')">表格 GR</button>
  </div>
  <button class="btn" onclick="downloadZip()">下载 zip</button>
  <a class="btn" href="/member">返回会员中心</a>
</div>
<iframe id="frame" title="报告内容"></iframe>
<div class="empty hidden" id="empty">无法加载预览，请重新登录会员中心</div>
<script>
const STORAGE = { token: 'xhs_member_token', viewMode: 'xhs_member_view_mode' };
const params = new URLSearchParams(location.search);
const reportDate = (params.get('date') || '').slice(0, 10);
const archiveType = params.get('archive_type') || 'member_daily_zip';
let entry = params.get('entry') || localStorage.getItem(STORAGE.viewMode) || 'index_vue.html';

function token() { return localStorage.getItem(STORAGE.token) || ''; }

function setEntry(ent) {
  entry = ent || 'index_vue.html';
  localStorage.setItem(STORAGE.viewMode, entry);
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('active', b.dataset.entry === entry));
  loadFrame();
}

function viewUrl(ent) {
  const t = token();
  return '/api/v1/member/reports/' + encodeURIComponent(reportDate)
    + '/view/' + encodeURIComponent(ent || entry)
    + '?archive_type=' + encodeURIComponent(archiveType)
    + '&access_token=' + encodeURIComponent(t);
}

function loadFrame() {
  const t = token();
  const frame = document.getElementById('frame');
  const empty = document.getElementById('empty');
  if (!t || !reportDate) {
    frame.classList.add('hidden');
    empty.classList.remove('hidden');
    empty.textContent = '请先登录会员中心后再预览';
    return;
  }
  empty.classList.add('hidden');
  frame.classList.remove('hidden');
  frame.src = viewUrl(entry);
}

function downloadZip() {
  const t = token();
  if (!t || !reportDate) return;
  const url = '/api/v1/member/reports/' + encodeURIComponent(reportDate)
    + '/download?archive_type=' + encodeURIComponent(archiveType)
    + '&access_token=' + encodeURIComponent(t);
  const a = document.createElement('a');
  a.href = url;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.getElementById('title').textContent = reportDate ? ('报告 ' + reportDate) : '报告预览';
document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('active', b.dataset.entry === entry));
loadFrame();
</script>
</body>
</html>
