<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>① 垂类竞品 · 多卖家对照</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--text:#1a2332;--muted:#5b6b7c;--line:#d7e2ec;
  --accent:#14708f;--accent-deep:#0f5a73;--accent-soft:#e6f4f8;
  --stage-pad:24px;--radius:12px;
  --ease-out:cubic-bezier(.25,.46,.45,.94);--dur-1:100ms;--dur-2:160ms;
  --font-display:"Segoe UI Semibold","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#eef6fb 0%,#f7fafc 48%,#f4f7fb 100%);color:var(--text)}
.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);background:rgba(244,247,251,.88);border-bottom:1px solid rgba(26,35,50,.06)}
.top-inner{max-width:none;margin:0;padding:14px var(--stage-pad) 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.brand .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin:0 0 4px}
.brand h1{margin:0;font-size:1.45rem;letter-spacing:-.02em;font-family:var(--font-display);font-weight:780;line-height:1.2}
.brand .lead{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 0;max-width:42rem}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav a{font-size:12px;font-weight:700;color:var(--accent-deep);text-decoration:none;padding:6px 12px;border-radius:999px;border:1px solid rgba(20,112,143,.28);background:var(--accent-soft);transition:border-color var(--dur-1) var(--ease-out)}
.nav a:hover{border-color:var(--accent)}
.nav a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wrap{max-width:none;margin:0;padding:18px var(--stage-pad) 64px}
.read-order{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:10px 12px;border-radius:var(--radius);border:1px solid rgba(20,112,143,.18);background:linear-gradient(135deg,rgba(230,244,248,.9),#fff)}
.read-order span{font-size:12px;font-weight:650;color:var(--accent-deep);padding:4px 10px;border-radius:999px;background:var(--accent-soft);border:1px solid rgba(20,112,143,.16)}
.read-order .sep{color:var(--muted);background:transparent;border:0;padding:4px 2px;font-weight:500}
.race{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;margin:0 0 18px}
@media (max-width:960px){.race{grid-template-columns:1fr}}
.race-map,.race-side{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 3px rgba(16,24,40,.05);overflow:hidden}
.race-map .hd,.race-side .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;padding:12px 14px 0}
.race-map h2,.race-side h2{margin:0;font-size:15px;font-weight:780;font-family:var(--font-display);letter-spacing:-.02em}
.race-map .meta,.race-side .meta{font-size:12px;color:var(--muted);font-weight:550}
#treemap{width:100%;height:340px}
.race-side ol{list-style:none;margin:0;padding:8px 10px 12px}
.race-side li{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:10px;cursor:pointer;transition:background var(--dur-1) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.race-side li:hover{background:var(--accent-soft);transform:translateY(-1px)}
.race-side li.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.race-side .rk{flex:0 0 1.4rem;font-size:12px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.race-side .nm{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race-side .up{flex:0 0 auto;font-size:11px;font-weight:750;color:#b12e3c}
.race-side .up::before{content:"↑ ";font-weight:800}
.drill-box{display:none;margin:0 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.drill-box.open{display:block}
.drill-box .dh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:0 0 8px}
.drill-box h3{margin:0;font-size:14px;font-weight:750}
.drill-box .crumbs{font-size:12px;color:var(--muted)}
.drill-box .crumbs button{border:0;background:transparent;color:var(--accent-deep);font-weight:700;cursor:pointer;padding:0 2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input{flex:1;min-width:220px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;outline:none;transition:box-shadow var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out)}
input:focus{border-color:rgba(20,112,143,.45);box-shadow:0 0 0 3px rgba(20,112,143,.18)}
button.primary{padding:11px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;transition:filter var(--dur-1) var(--ease-out)}
button.primary:hover{filter:brightness(1.05)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.card .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.card .v{font-size:1.28rem;font-weight:780;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.zone{margin:0 0 16px}
.zone-lab{display:inline-flex;align-items:center;gap:8px;margin:0 0 10px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;background:#e8eef4;color:var(--accent-deep);border:1px solid rgba(20,112,143,.2)}
.zone-lab .n{display:inline-flex;align-items:center;justify-content:center;min-width:1.25rem;height:1.25rem;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:800}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{background:var(--accent-soft);color:var(--accent-deep);font-size:12px;position:sticky;top:64px;z-index:2}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.item-row{cursor:pointer;transition:background var(--dur-1) var(--ease-out)}
tr.item-row:hover{background:#f3f9fc}
.muted{color:var(--muted)}
.err{color:#b12e3c}
.kw-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 16px}
.kw-box .kw-hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin:0 0 10px}
.kw-box h3{margin:0;font-size:14px;font-weight:750}
.kw-meta{font-size:12px;color:var(--muted);font-weight:500}
.kw-drive-lab{font-size:11px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-deep);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.drive{gap:8px;margin:0 0 8px}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:16rem;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#f7fbfd;font-size:12px;color:var(--accent-deep);cursor:pointer;transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.chip:hover{border-color:rgba(20,112,143,.4)}
.chip.pinned{background:var(--accent-soft);border-color:#b7d7e3;font-weight:650}
.chip.drive{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.chip.drive .tag{color:rgba(255,255,255,.85)}
.chip.off{opacity:.55}
.chip .tag{font-size:10px;color:var(--muted);font-weight:600;flex-shrink:0}
.chip .kw{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kw-more{margin-top:8px;border:1px solid rgba(20,112,143,.14);border-radius:10px;background:#f8fbfd;padding:0}
.kw-more>summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:12px;font-weight:700;color:var(--accent-deep);user-select:none}
.kw-more>summary::-webkit-details-marker{display:none}
.kw-more>summary::before{content:"▸ ";opacity:.7}
.kw-more[open]>summary::before{content:"▾ "}
.kw-more .kw-more-bd{padding:0 12px 12px}
.kw-more .sub-lab{font-size:11px;font-weight:700;color:var(--muted);margin:8px 0 4px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.ttl-hit{color:var(--accent);font-weight:650}
.ttl-hit:hover{text-decoration:underline}
.status{font-size:13px;color:var(--muted);margin:0 0 12px;min-height:1.2em}
.empty{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);background:rgba(255,255,255,.7);color:var(--muted);font-size:13px;line-height:1.55}
.empty b{color:var(--text);font-weight:700}
.empty .ex{display:inline-flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.empty .ex button{border:1px solid rgba(20,112,143,.28);background:var(--accent-soft);color:var(--accent-deep);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.empty .ex button:hover{border-color:var(--accent)}
.skeleton{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin:0 0 16px}
.skeleton i{display:block;height:64px;border-radius:var(--radius);background:linear-gradient(90deg,#eef3f8 25%,#f7fafc 50%,#eef3f8 75%);background-size:200% 100%;animation:sk 1.1s ease-in-out infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton i{animation:none}}
</style>
<script>
(function(){
  var cloud = /\/channel\//.test(location.pathname||'');
  window.__BOARD_CLOUD = cloud;
  window.__BOARD_STATIC = cloud ? '/channel/board' : '/ops';
  window.__SNAP_BASE = cloud ? '/channel/board/home_snap' : '/snap';
  window.__VERT_SNAP = cloud ? '/channel/board/vertical_snap' : '/ops/vertical_snap';
  function add(src){ var s=document.createElement('script'); s.src=src; document.write(s.outerHTML); }
  add(window.__BOARD_STATIC + '/echarts.min.js');
  add(window.__BOARD_STATIC + '/report_growth_ui.js');
})();
</script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="eyebrow">① 垂类细分 · 同簇多卖家</div>
      <h1>垂类竞品对照</h1>
      <p class="lead">搜垂类词 → 看多卖家表 → 点行打开走势精读（上走势 / 下各日增量）。零详情额度。</p>
    </div>
    <nav class="nav" aria-label="四看板导航" id="boardNav">
      <a href="/hub/" id="navHub">入口</a>
      <a class="on" href="/vertical/" id="navVertical">①垂类</a>
      <a href="/ops/" id="navOps">②比货</a>
      <a href="/" id="navWorkbench">③任务台</a>
      <a href="/cycle-hub/" id="navCycle">④周期包</a>
    </nav>
    <script>
    (function(){
      try{
        if(window.__BOARD_CLOUD){
          var m={navHub:'/channel/hub/',navVertical:'/channel/board/vertical_niche.html',navOps:'/channel/board/',navWorkbench:'/channel/workbench/',navCycle:'/channel/board/cycle_static/hub.html'};
          Object.keys(m).forEach(function(id){ var a=document.getElementById(id); if(a) a.href=m[id]; });
        }
        var emb = /(?:\?|&)embed=1(?:&|$)/.test(location.search) || (window.self !== window.top);
        if(emb){
          document.documentElement.classList.add('hub-embed');
          var css = document.createElement('style');
          css.textContent = [
            'html.hub-embed #boardNav,html.hub-embed .nav{display:none!important}',
            'html.hub-embed .top-inner{padding:6px var(--stage-pad) 6px!important;gap:8px!important}',
            'html.hub-embed .brand .eyebrow,html.hub-embed .brand .lead{display:none!important}',
            'html.hub-embed .brand h1{font-size:1.05rem!important;line-height:1.25!important}',
            'html.hub-embed .read-order{display:none!important}'
          ].join('');
          document.head.appendChild(css);
        }
      }catch(_){}
    })();
    </script>
  </div>
</header>
<div class="wrap">
  <div class="read-order" aria-label="读数顺序">
    <span>0 看赛道热力</span><span class="sep">→</span>
    <span>1 搜垂类词</span><span class="sep">→</span>
    <span>2 看卖家/SKU</span><span class="sep">→</span>
    <span>3 点行开曲线</span>
  </div>
  <section class="race" aria-label="赛道热力">
    <div class="race-map">
      <div class="hd">
        <h2>赛道热力 · Treemap</h2>
        <span class="meta" id="treemapMeta">面积=近7日增量 · 颜色=份额强度 · 点方块下钻</span>
      </div>
      <div id="treemap" role="img" aria-label="虚资 L2 增量 Treemap"></div>
    </div>
    <aside class="race-side">
      <div class="hd"><h2>增速 TOP10</h2><span class="meta">人均增量</span></div>
      <ol id="growthTop"></ol>
    </aside>
  </section>
  <div id="drillBox" class="drill-box" aria-live="polite">
    <div class="dh">
      <div>
        <div class="crumbs" id="drillCrumbs"></div>
        <h3 id="drillTitle">类目深钻</h3>
      </div>
      <button type="button" class="primary" id="drillSearchBtn" style="padding:8px 12px;font-size:12px">用该类搜垂类</button>
    </div>
    <div id="drillBody" class="muted" style="font-size:13px">点 Treemap 方块加载 L3 / 标杆品</div>
  </div>
  <div class="bar">
    <input id="q" placeholder="垂类键 / 关键词，例如：拼豆 / saas / 测评" aria-label="垂类搜索" onkeydown="if(event.key==='Enter')run()"/>
    <button type="button" class="primary" onclick="run()">分析垂类</button>
  </div>
  <div id="sum" class="cards"></div>
  <div id="kw" class="kw-box" style="display:none"></div>
  <p id="msg" class="status">输入关键词开始 · 点标题或迷你曲线打开精读弹层</p>
  <div id="emptyHome" class="empty">
    <b>还没有分析结果</b><br/>先搜一个垂类词，再看多卖家表与走势精读。
    <div class="ex">
      <button type="button" onclick="quickQ('拼豆')">拼豆</button>
      <button type="button" onclick="quickQ('测评')">测评</button>
      <button type="button" onclick="quickQ('saas')">saas</button>
      <button type="button" onclick="quickQ('行测')">行测</button>
    </div>
  </div>
  <div id="sellers" class="zone"></div>
  <div id="table" class="zone"></div>
</div>
<script>
window.GROWTH_CURVES = window.GROWTH_CURVES || {};
let _itemsById = {};
let _growthUI = null;
const PIN_SHOW = 10;
const CAND_SHOW = 8;
const DRIVE_SHOW = 10;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));}
function quickQ(kw){
  document.getElementById('q').value=kw;
  run();
}
function chipHtml(x, role){
  const on=Number(x.is_active||0)===1;
  const cls='chip'
    +(role==='pinned'?' pinned':'')
    +(role==='drive'?' drive':'')
    +(on||role==='drive'?'':' off');
  const tag=role==='drive'?'驱动'
    :(role==='pinned'?(on?'已挂·采':'已挂'):(on?'候选·活':'候选'));
  const kw=String(x.keyword||x||'');
  return `<button type="button" class="${cls}" title="${esc(x.pin_notes||x.source||kw)}" onclick="document.getElementById('q').value=decodeURIComponent('${encodeURIComponent(kw)}');run()"><span class="tag">${tag}</span><span class="kw">${esc(kw)}</span></button>`;
}
function renderKwBox(niche, sk, drive){
  const pinned=sk.pinned||[];
  const cands=sk.candidates||[];
  const driveList=(drive||[]).map(k=>({keyword:k,is_active:1}));
  const driveChips=driveList.slice(0,DRIVE_SHOW).map(x=>chipHtml(x,'drive')).join('');
  const pinHead=pinned.slice(0,PIN_SHOW).map(x=>chipHtml(x,'pinned')).join('');
  const candHead=cands.slice(0,CAND_SHOW).map(x=>chipHtml(x,'cand')).join('');
  const pinRest=Math.max(0, pinned.length-PIN_SHOW);
  const candRest=Math.max(0, cands.length-CAND_SHOW);
  const moreNeeded=pinned.length>PIN_SHOW || cands.length>CAND_SHOW || (!driveList.length && (pinned.length||cands.length));
  let moreHtml='';
  if(moreNeeded){
    const allPin=pinned.map(x=>chipHtml(x,'pinned')).join('')||'<span class="muted">无已挂词</span>';
    const allCand=cands.map(x=>chipHtml(x,'cand')).join('')||'<span class="muted">无候选</span>';
    const extra=pinRest+candRest;
    moreHtml=`<details class="kw-more"><summary>展开全部搜词 · 已挂 ${pinned.length} · 候选 ${cands.length}${extra?` · 折叠内 +${extra}`:''}</summary>
      <div class="kw-more-bd">
        <div class="sub-lab">已挂 · vertical_niche_probe</div>
        <div class="chips">${allPin}</div>
        <div class="sub-lab">词库候选</div>
        <div class="chips">${allCand}</div>
      </div>
    </details>`;
  }
  const driveBlock=driveChips
    ? `<div class="kw-drive-lab">本次驱动（最多 ${DRIVE_SHOW}）</div><div class="chips drive">${driveChips}</div>`
    : `<div class="kw-drive-lab">本次驱动</div><div class="muted" style="font-size:12px;margin-bottom:8px">暂无驱动词 · 点下方已挂/候选试搜</div>
       <div class="chips">${pinHead||candHead||'<span class="muted">尚未挂词；可用词库候选或上方示例</span>'}</div>`;
  return `<div class="kw-hd"><h3>垂类搜词 · ${esc(niche)}</h3>
    <span class="kw-meta">${esc(sk.pin_group||'vertical_niche_probe')} · via=${esc(sk.via||'')||'—'} · 已挂 ${pinned.length} · 候选 ${cands.length}</span></div>
    ${driveBlock}
    ${moreHtml}
    <p class="hint">挂词命令：python tools/pin_vertical_niche_keywords.py --niche ${esc(niche)} --apply · 首屏只亮驱动短名单，全量进折叠，避免 chip 墙。</p>`;
}
function axisToCurve(axis){
  const pts=[];
  for(const p of (axis||[])){
    if(!p||p.sold==null) continue;
    const sold=Number(p.sold)||0;
    const delta=Number(p.delta)||0;
    const prev=Math.max(0, sold-delta);
    const gr=prev>0?(delta/prev*100):0;
    pts.push([String(p.d||'').slice(0,10), sold, delta, Number(gr.toFixed(2))]);
  }
  return pts;
}
function ensureGrowthUI(){
  if(_growthUI) return _growthUI;
  if(!window.ReportGrowthUI||!window.echarts){
    console.warn('[vertical] ReportGrowthUI/echarts 未加载');
    return null;
  }
  _growthUI=window.ReportGrowthUI.mount();
  return _growthUI;
}
function openCurve(gid){
  const it=_itemsById[gid];
  if(!it) return;
  const gui=ensureGrowthUI();
  if(!gui) return;
  gui.curves=window.GROWTH_CURVES;
  gui.openModal({
    goods_id: gid,
    title: it.title||gid,
    keyword: (it.touch_keywords||[]).slice(0,2).join(' · '),
    actual_gr: it.actual_gr,
    a_3d: it.a_3d,
    delta: it.delta,
    sold: it.sold,
    price: it.price,
    detail_url: 'https://www.xiaohongshu.com/goods-detail/'+encodeURIComponent(gid)
  });
}
async function hydrateCurves(items){
  const ids=(items||[]).map(x=>String(x.goods_id||'')).filter(Boolean).slice(0,80);
  if(!ids.length) return;
  try{
    const u=new URL('/api/goods-spark', location.origin);
    u.searchParams.set('ids', ids.join(','));
    u.searchParams.set('days','60');
    const data=await (await fetch(u)).json();
    const series=(data&&data.series)||{};
    window.GROWTH_CURVES=window.GROWTH_CURVES||{};
    for(const gid of ids){
      const tl=series[gid]||{};
      const pts=axisToCurve(tl.axis_30d);
      if(pts.length) window.GROWTH_CURVES[gid]=pts;
    }
    const gui=ensureGrowthUI();
    if(gui) gui.curves=window.GROWTH_CURVES;
    document.querySelectorAll('[data-spark-gid]').forEach(el=>{
      const gid=el.getAttribute('data-spark-gid');
      if(!gui||!window.GROWTH_CURVES[gid]||!window.GROWTH_CURVES[gid].length){
        el.innerHTML='<span class="muted" style="font-size:11px">无曲线</span>';
      }else{
        el.innerHTML=gui.sparkHtml(gid);
        el.classList.add('g-spark-hit','js-g-spark');
        el.setAttribute('data-gid', gid);
        el.onclick=function(e){e.stopPropagation();openCurve(gid);};
      }
    });
  }catch(e){
    console.warn('[vertical] goods-spark failed', e);
  }
}
function vertSnapBase(){ return window.__VERT_SNAP || '/ops/vertical_snap'; }
function snapBase(){ return window.__SNAP_BASE || '/snap'; }
function nicheSlug(q){ return String(q||'').replace(/[\\/:*?"<>|\s]+/g,'_').replace(/^[._]+|[._]+$/g,'').slice(0,60); }
async function fetchJsonSafe(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const ct=String(r.headers.get('content-type')||'');
  const t=(await r.text()).replace(/^\uFEFF/,'').trim();
  if(!t || t.charAt(0)==='<' || /text\/html/i.test(ct)) throw new Error('HTML');
  return JSON.parse(t);
}
async function loadVerticalStatic(q){
  const base=vertSnapBase();
  const slug=nicheSlug(q);
  const pick=async (row)=>{
    const fp=String(row.file||'').replace(/^vertical_snap\//,'');
    const data=await fetchJsonSafe(base+'/'+(fp||(String(row.slug||slug)+'.json')));
    if(data && data.ok){ data.served_from='vertical_snap'; return data; }
    return null;
  };
  // catalog：精确 → 包含/被包含模糊 → 直接文件
  try{
    const cat=await fetchJsonSafe(base+'/catalog.json');
    const items=cat.items||[];
    for(const row of items){
      if(String(row.niche||'')===q || String(row.slug||'')===slug){
        const hit=await pick(row); if(hit) return hit;
      }
    }
    // 模糊：公考→公考资料；测评→心理测评
    const soft=[];
    for(const row of items){
      const n=String(row.niche||'');
      if(!n) continue;
      if(n.includes(q) || q.includes(n)) soft.push(row);
    }
    soft.sort((a,b)=>String(a.niche).length-String(b.niche).length);
    for(const row of soft){
      const hit=await pick(row); if(hit) return hit;
    }
  }catch(_){}
  try{
    const data=await fetchJsonSafe(base+'/'+encodeURIComponent(slug)+'.json');
    if(data && data.ok){ data.served_from='vertical_snap'; return data; }
  }catch(_){}
  return null;
}
function verticalApiPath(){
  // 原合同：本机 /api/vertical-niche；云走 /channel/api/（nginx 只反代 /channel/）
  return window.__BOARD_CLOUD ? '/channel/api/vertical-niche' : '/api/vertical-niche';
}
async function bootCatalogChips(){
  // 导航壳对接原页：空态保持「任意搜词」示例；静包仅作可选快捷，不喧宾夺主
  const box=document.getElementById('emptyHome');
  if(!box) return;
  try{
    const cat=await fetchJsonSafe(vertSnapBase()+'/catalog.json');
    const items=(cat.items||[]).filter(x=>x && x.ok!==false).slice(0,12);
    if(!items.length) return;
    const chips=items.map(x=>`<button type="button" onclick="quickQ('${esc(x.niche)}')">${esc(x.niche)}</button>`).join('');
    const ex=box.querySelector('.ex');
    if(ex) ex.insertAdjacentHTML('beforeend', chips);
  }catch(_){}
}
async function run(){
  const q=document.getElementById('q').value.trim();
  const msg=document.getElementById('msg');
  const emptyHome=document.getElementById('emptyHome');
  if(!q){
    msg.textContent='请输入关键词';
    if(emptyHome) emptyHome.style.display='block';
    return;
  }
  msg.textContent='加载中…';
  if(emptyHome) emptyHome.style.display='none';
  document.getElementById('sum').innerHTML='<div class="skeleton"><i></i><i></i><i></i><i></i><i></i></div>';
  document.getElementById('kw').style.display='none';
  document.getElementById('sellers').innerHTML='';
  document.getElementById('table').innerHTML='';
  // 原设计：任意搜词走 API；静包只作离线兜底（API 空结果也回落）
  let data=null;
  try{
    const u=new URL(verticalApiPath(), location.origin);
    u.searchParams.set('q', q);
    u.searchParams.set('niche', q);
    u.searchParams.set('limit','80');
    data=await fetchJsonSafe(u.toString());
  }catch(_){ data=null; }
  const apiEmpty=!data || data.ok===false || !((data.items&&data.items.length)||(data.sellers&&data.sellers.length));
  if(apiEmpty){
    try{
      const snap=await loadVerticalStatic(q);
      if(snap && snap.ok && ((snap.items&&snap.items.length)||(snap.sellers&&snap.sellers.length))) data=snap;
    }catch(_){}
  }
  if(!data){
    msg.innerHTML='<span class="err">垂类 API 失败 · 本机请确认 8765 /api/vertical-niche；云端请部署 /channel/api/vertical-niche</span>';
    document.getElementById('sum').innerHTML='';
    if(emptyHome){
      emptyHome.style.display='block';
    }
    return;
  }
  if(!data.ok){
    msg.innerHTML='<span class="err">'+esc(data.error||'失败')+'</span>';
    document.getElementById('sum').innerHTML='';
    if(emptyHome){
      emptyHome.style.display='block';
      emptyHome.innerHTML=`<b>没有可用结果</b><br/>${esc(data.error||'换个更具体的垂类词再试')}<div class="ex"><button type="button" onclick="quickQ('拼豆')">拼豆</button><button type="button" onclick="quickQ('行测')">行测</button></div>`;
    }
    return;
  }
  const s=data.summary||{};
  const sk=Object.assign({}, data.search_keywords||{}, {via: data.via||''});
  document.getElementById('sum').innerHTML=
    `<div class="card"><div class="k">卖家数</div><div class="v">${s.seller_n??0}</div></div>`+
    `<div class="card"><div class="k">同簇 SKU</div><div class="v">${s.sku_n??0}</div></div>`+
    `<div class="card"><div class="k">增量合计</div><div class="v">${Number(s.sum_delta||0).toLocaleString()}</div></div>`+
    `<div class="card"><div class="k">中位价</div><div class="v">${s.median_price!=null?s.median_price:'—'}</div></div>`+
    `<div class="card"><div class="k">驱动搜词</div><div class="v">${s.drive_kw_n??(sk.drive_keywords||[]).length}</div></div>`;
  const niche=(data.seed&&data.seed.niche)||q;
  const drive=sk.drive_keywords||[];
  const kwEl=document.getElementById('kw');
  kwEl.style.display='block';
  kwEl.innerHTML=renderKwBox(niche, sk, drive);
  msg.textContent='niche='+niche+' · 种子：'+(data.seed&&data.seed.tokens?data.seed.tokens.join(' · '):q)+' · 点行看「走势+各日增量」';
  const sellers=data.sellers||[];
  document.getElementById('sellers').innerHTML=
    '<div class="zone-lab"><span class="n">2</span>卖家汇总（按增量）</div>'+
    (sellers.length
      ? ('<table><thead><tr><th>店铺</th><th class="num">SKU数</th><th class="num">增量合计</th><th>代表品</th></tr></thead><tbody>'+
        sellers.slice(0,25).map(x=>`<tr><td>${esc(x.store_name)}</td><td class="num">${x.sku_n}</td><td class="num">${Number(x.sum_delta||0).toLocaleString()}</td><td class="muted">${esc(x.top_title)}</td></tr>`).join('')+
        '</tbody></table>')
      : '<div class="empty"><b>暂无卖家汇总</b><br/>该垂类还没有聚到店铺，换词或先挂 probe 词再采。</div>');
  const items=data.items||[];
  _itemsById={};
  items.forEach(it=>{ if(it.goods_id) _itemsById[String(it.goods_id)]=it; });
  if(!items.length){
    document.getElementById('table').innerHTML='<div class="empty"><b>暂无商品明细</b><br/>换个更具体的搜词，或确认该垂类已采到增量货。<div class="ex"><button type="button" onclick="quickQ(\'拼豆图纸\')">拼豆图纸</button><button type="button" onclick="quickQ(\'行测\')">行测</button></div></div>';
    return;
  }
  document.getElementById('table').innerHTML=
    '<div class="zone-lab"><span class="n">3</span>商品明细 · 点行开曲线精读</div>'+
    '<table><thead><tr><th>店铺</th><th>标题</th><th>曲线</th><th>触达词</th><th class="num">销量</th><th class="num">增量</th><th class="num">增速%</th><th class="num">价</th></tr></thead><tbody>'+
    items.map(it=>{
      const gid=esc(it.goods_id);
      return `<tr class="item-row" data-gid="${gid}" onclick="openCurve('${gid}')">
      <td>${esc(it.store_name)}</td>
      <td><span class="ttl-hit">${esc(it.title)}</span></td>
      <td><span data-spark-gid="${gid}" class="muted" style="font-size:11px">…</span></td>
      <td class="muted">${esc((it.touch_keywords||[]).slice(0,4).join(' · ')||'—')}</td>
      <td class="num">${Number(it.sold||0).toLocaleString()}</td>
      <td class="num">${Number(it.delta||0).toLocaleString()}</td>
      <td class="num">${it.actual_gr!=null?it.actual_gr:'—'}</td>
      <td class="num">${it.price||'—'}</td>
    </tr>`;
    }).join('')+
    '</tbody></table>';
  await hydrateCurves(items);
}

let _treemapChart = null;
let _treemapData = null;
let _drillL2 = '';

function growthColor(g){
  // Operate 浅色底：低份额冷青灰 → 高份额强调红（稀缺）
  const x = Math.max(0, Math.min(1, Number(g)||0));
  const r = Math.round(20 + x * 177);
  const green = Math.round(112 - x * 66);
  const b = Math.round(143 - x * 77);
  return `rgb(${r},${green},${b})`;
}

function safeSlug(l2){
  return String(l2||'(未划分)').replace(/[\\/:*?"<>|\s]+/g,'_').replace(/^[._]+|[._]+$/g,'').slice(0,80) || '_none';
}

async function loadDrill(l2, l3){
  _drillL2 = l2 || '';
  const box = document.getElementById('drillBox');
  const body = document.getElementById('drillBody');
  const title = document.getElementById('drillTitle');
  const crumbs = document.getElementById('drillCrumbs');
  box.classList.add('open');
  crumbs.innerHTML = `<button type="button" onclick="loadDrill('${esc(l2)}')">全部 L2</button>` +
    (l3 ? ` / <span>${esc(l3)}</span>` : '');
  title.textContent = l3 ? (l2 + ' / ' + l3) : (l2 || '类目深钻');
  body.innerHTML = '<div class="skeleton"><i></i><i></i><i></i></div>';
  const slug = safeSlug(l2);
  const urls = [
    '/snap/scene_l3/' + encodeURIComponent(slug) + '.json',
    './home_snap/scene_l3/' + encodeURIComponent(slug) + '.json'
  ];
  let raw = null;
  for (const u of urls){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if(!r.ok) continue;
      raw = await r.json();
      if(raw && raw.ok !== false) break;
    }catch(_){}
  }
  if(!raw || raw.ok === false){
    body.innerHTML = '<span class="muted">暂无该类静态深钻包 · 流水线生成后可读 · 仍可用上方搜词</span>';
    return;
  }
  const l3rows = (raw.l3||[]).slice(0,12);
  let tops = raw.top_items || [];
  if(l3){
    tops = tops.filter(it => String(it.scene_l3||'') === l3);
  }
  body.innerHTML =
    '<div style="margin:0 0 10px;font-size:12px;color:var(--muted)">商品 ' +
    Number(raw.goods_n||0).toLocaleString() + ' · 7日增量 ' +
    Number(raw.sum_delta_7d||0).toLocaleString() +
    (raw.snap_at ? ' · snap ' + esc(String(raw.snap_at).slice(0,19)) : '') +
    '</div>' +
    (l3rows.length
      ? ('<div class="chips" style="margin:0 0 10px">' +
         l3rows.map(x =>
           `<button type="button" class="chip" onclick="loadDrill('${esc(l2)}','${esc(x.scene_l3)}')">` +
           `<span class="kw">${esc(x.scene_l3)}</span>` +
           `<span class="tag">Δ${Number(x.sum_delta_7d||0).toLocaleString()}</span></button>`
         ).join('') + '</div>')
      : '') +
    (tops.length
      ? ('<table><thead><tr><th>标题</th><th class="num">增量</th><th class="num">增速%</th><th>L3</th></tr></thead><tbody>' +
         tops.slice(0,15).map(it =>
           `<tr><td>${esc(it.title||it.goods_id)}</td>` +
           `<td class="num">${Number(it.sum_delta_7d||it.delta||0).toLocaleString()}</td>` +
           `<td class="num">${it.actual_gr!=null?it.actual_gr:'—'}</td>` +
           `<td class="muted">${esc(it.scene_l3||'—')}</td></tr>`
         ).join('') + '</tbody></table>')
      : '<div class="muted">该类暂无标杆短名单</div>');
}

function highlightGrowth(name){
  document.querySelectorAll('#growthTop li').forEach(li => {
    li.classList.toggle('on', li.getAttribute('data-name') === name);
  });
}

function renderGrowthTop(list){
  const ol = document.getElementById('growthTop');
  if(!list || !list.length){
    ol.innerHTML = '<li class="muted" style="padding:12px">暂无榜 · 等静态包</li>';
    return;
  }
  ol.innerHTML = list.map((x,i) =>
    `<li data-name="${esc(x.name)}" onclick="onRacePick('${esc(x.name)}')">` +
    `<span class="rk">${i+1}</span>` +
    `<span class="nm" title="${esc(x.name)}">${esc(x.name)}</span>` +
    `<span class="up">${Number(x.per_delta||0).toFixed(1)}</span></li>`
  ).join('');
}

function onRacePick(l2){
  highlightGrowth(l2);
  loadDrill(l2);
  if(_treemapChart){
    try{
      _treemapChart.dispatchAction({type:'highlight', name: l2});
      _treemapChart.dispatchAction({type:'showTip', name: l2});
    }catch(_){}
  }
}

function buildTreemapOption(tree){
  const data = (tree||[]).map(n => ({
    name: n.name,
    value: n.value,
    growth: n.growth,
    goods_n: n.goods_n,
    per_delta: n.per_delta,
    itemStyle: { color: growthColor(n.growth) },
    children: (n.children||[]).map(c => ({
      name: c.name,
      value: c.value,
      growth: c.growth,
      scene_l2: n.name,
      scene_l3: c.scene_l3 || c.name,
      itemStyle: { color: growthColor(c.growth) }
    }))
  }));
  return {
    tooltip: {
      formatter: function(info){
        const d = info.data || {};
        return `<b>${esc(info.name)}</b><br/>增量 ${Number(info.value||0).toLocaleString()}` +
          (d.goods_n!=null ? `<br/>商品 ${Number(d.goods_n).toLocaleString()}` : '') +
          (d.per_delta!=null ? `<br/>人均Δ ${Number(d.per_delta).toFixed(1)}` : '');
      }
    },
    series: [{
      type: 'treemap',
      roam: false,
      nodeClick: 'zoomToNode',
      breadcrumb: { show: true, height: 22, left: 8, top: 4,
        itemStyle: { color: '#e6f4f8', borderColor: '#b7d7e3', textStyle: { color: '#0f5a73', fontWeight: 700 } } },
      label: { show: true, formatter: '{b}', fontSize: 12, fontWeight: 700, color: '#1a2332' },
      upperLabel: { show: true, height: 22, color: '#0f5a73', fontWeight: 750 },
      itemStyle: { borderColor: '#fff', borderWidth: 2, gapWidth: 2 },
      levels: [
        { itemStyle: { borderWidth: 0, gapWidth: 3 } },
        { colorSaturation: [0.25, 0.55], itemStyle: { borderWidth: 2, gapWidth: 1 } }
      ],
      data
    }]
  };
}

async function initRaceTreemap(){
  const el = document.getElementById('treemap');
  const meta = document.getElementById('treemapMeta');
  if(!window.echarts || !el){
    meta.textContent = '缺 echarts · 无法渲染热力';
    return;
  }
  const urls = [
    snapBase()+'/scene_treemap.json',
    (window.__BOARD_STATIC||'/ops')+'/home_snap/scene_treemap.json',
    './home_snap/scene_treemap.json'
  ];
  let data = null;
  for (const u of urls){
    try{
      data = await fetchJsonSafe(u);
      if(data && data.ok !== false) break;
    }catch(_){ data=null; }
  }
  // 降级：用 scene_coverage 拼简易树
  if(!data || !data.tree || !data.tree.length){
    try{
      const cov = await fetchJsonSafe(snapBase()+'/scene_coverage.json');
      const items = cov.items || [];
      data = {
        ok: true,
        tree: items.filter(x => x.scene_l2 && String(x.scene_l2).indexOf('收纳')<0).map(x => ({
          name: x.scene_l2,
          value: Number(x.sum_delta_7d||0),
          goods_n: x.goods_n,
          growth: Math.min(1, Number(x.delta_share_pct||0)/40),
          per_delta: Number(x.sum_delta_7d||0)/Math.max(1, Number(x.goods_n||1)),
          children: (x.top_l3||[]).map(c => ({
            name: c.scene_l3, value: Number(c.sum_delta_7d||0),
            growth: Number(c.delta_share_pct||0)/100, scene_l3: c.scene_l3
          }))
        })),
        topGrowth: []
      };
      data.topGrowth = data.tree.slice().sort((a,b)=>b.per_delta-a.per_delta).slice(0,10)
        .map(x => ({name:x.name, per_delta:x.per_delta, delta:x.value, goods_n:x.goods_n}));
    }catch(_){}
  }
  if(!data || !(data.tree||[]).length){
    meta.textContent = '暂无赛道静态包 · 跑流水线后自动出现';
    renderGrowthTop([]);
    return;
  }
  _treemapData = data;
  meta.textContent = (data.n || data.tree.length) + ' 个虚资 L2 · ' +
    (data.snap_at ? ('snap ' + String(data.snap_at).slice(0,19)) : 'coverage 降级');
  renderGrowthTop(data.topGrowth || []);
  _treemapChart = echarts.init(el);
  _treemapChart.setOption(buildTreemapOption(data.tree));
  _treemapChart.on('click', function(p){
    const d = p.data || {};
    const l2 = d.scene_l2 || (p.treePathInfo && p.treePathInfo[1] && p.treePathInfo[1].name) || p.name;
    const l3 = d.scene_l3 || (d.scene_l2 ? p.name : '');
    if(d.scene_l2 && d.scene_l3){
      highlightGrowth(d.scene_l2);
      loadDrill(d.scene_l2, d.scene_l3);
    }else{
      highlightGrowth(l2);
      loadDrill(l2, l3 && l3 !== l2 ? l3 : '');
    }
  });
  window.addEventListener('resize', function(){ try{ _treemapChart && _treemapChart.resize(); }catch(_){} });
}

document.getElementById('drillSearchBtn').addEventListener('click', function(){
  if(!_drillL2) return;
  document.getElementById('q').value = _drillL2;
  run();
});

initRaceTreemap();
bootCatalogChips();
const sp=new URLSearchParams(location.search);
if(sp.get('q')){document.getElementById('q').value=sp.get('q');run();}
</script>
