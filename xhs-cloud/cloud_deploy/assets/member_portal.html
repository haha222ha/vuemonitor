<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0071e3">
<title>选品报告会员中心</title>
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--text2:#6e6e73;
  --accent:#0071e3;--red:#ff3b30;--orange:#ff9500;--green:#34c759;
  --line:rgba(0,0,0,.08);--radius:12px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:var(--safe-b)}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px calc(48px + var(--safe-b))}
h1{font-size:clamp(22px,5vw,28px);font-weight:700;margin-bottom:4px;letter-spacing:-.02em}
.sub{color:var(--text2);font-size:clamp(13px,3.2vw,14px);margin-bottom:20px;line-height:1.5}
.card{background:var(--surface);border-radius:var(--radius);padding:clamp(16px,4vw,20px);margin-bottom:16px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:10px 12px;border-radius:20px;font-size:14px;cursor:pointer;background:#e8e8ed;color:var(--text2);-webkit-tap-highlight-color:transparent}
.tab.active{background:var(--accent);color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--surface)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-block{width:100%}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{filter:brightness(.92)}
.btn-ghost{background:transparent;color:var(--accent);min-height:36px;padding:6px 12px;font-size:14px}
.alert{padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:16px;line-height:1.5}
.alert-warn{background:#fff4e5;color:#8a6100;border:1px solid #ffd699}
.alert-error{background:#ffebe9;color:#c41e00;border:1px solid #ffc9c4}
.alert-ok{background:#e8f8ee;color:#1a7f37;border:1px solid #b8e6c8}
.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:520px){.profile-grid{grid-template-columns:repeat(4,1fr)}}
.profile-item{background:#f9f9fb;padding:12px;border-radius:10px}
.profile-item .v{font-size:clamp(16px,4vw,20px);font-weight:700;word-break:break-all}
.profile-item .l{font-size:11px;color:var(--text2);margin-top:4px}
.seg{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.seg button{flex-shrink:0;padding:10px 18px;border-radius:20px;font-size:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:40px}
.seg button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.report-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--text2);font-weight:500;font-size:12px;white-space:nowrap}
.report-cards{display:none}
.report-card{background:#f9f9fb;border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.report-card .rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.report-card .rc-date{font-size:16px;font-weight:700}
.report-card .rc-meta{font-size:12px;color:var(--text2);line-height:1.6}
.report-card .btn{width:100%;margin-top:10px}
@media(max-width:640px){
  .report-table-wrap{display:none}
  .report-cards{display:block}
  .topbar{flex-direction:column;align-items:flex-start!important;gap:8px}
}
.empty{text-align:center;padding:36px 16px;color:var(--text2);font-size:14px}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.welcome-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);background:#e8e8ed;padding:6px 12px;border-radius:20px;margin-top:8px}
.welcome-chip strong{color:var(--text)}
.section-title{font-size:16px;font-weight:600}
.renew-box{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>选品报告会员中心</h1>
      <p class="sub">登录后可下载全部历史日报 / 周报 / 月报（zip 含 HTML + data.js）</p>
      <div class="welcome-chip hidden" id="welcomeChip">欢迎回来，<strong id="welcomeName"></strong></div>
    </div>
    <button class="btn btn-ghost hidden" id="btnLogout" onclick="logout()">退出登录</button>
  </div>

  <div id="authView">
    <div class="tabs">
      <div class="tab active" data-tab="login" onclick="switchTab('login')">登录</div>
      <div class="tab" data-tab="register" onclick="switchTab('register')">授权码开通</div>
    </div>
    <div class="card" id="panelLogin">
      <div class="field"><label>用户名</label><input id="loginUser" autocomplete="username" enterkeyhint="next"></div>
      <div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password" enterkeyhint="go" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
    </div>
    <div class="card hidden" id="panelRegister">
      <div class="field"><label>授权码</label><input id="regCode" placeholder="XHS-XXXX-XXXX-XXXX" autocomplete="off"></div>
      <div class="field"><label>用户名（新建账号）</label><input id="regUser" autocomplete="username"></div>
      <div class="field"><label>密码（至少 6 位）</label><input id="regPass" type="password" autocomplete="new-password" enterkeyhint="go" onkeydown="if(event.key==='Enter')doRegister()"></div>
      <button class="btn btn-primary btn-block" onclick="doRegister()">开通并登录</button>
      <p style="font-size:12px;color:var(--text2);margin-top:12px">开通成功后将自动记住登录状态，下次打开无需重新输入</p>
    </div>
    <div id="authMsg"></div>
  </div>

  <div id="dashView" class="hidden">
    <div id="expiryBanner"></div>
    <div class="card">
      <div class="section-title">会员信息</div>
      <div class="profile-grid" id="profileGrid"></div>
      <div class="renew-box">
        <div class="field"><label>授权码续费</label><input id="renewCode" placeholder="输入新授权码延长会员" autocomplete="off"></div>
        <button class="btn btn-primary btn-block" onclick="doRenew()">续费</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title">报告库</div>
      <p style="font-size:13px;color:var(--text2);margin:8px 0 14px">有效期内可下载全部已发布报告（含历史往期）</p>
      <div class="seg" id="typeSeg">
        <button class="active" data-type="daily" onclick="setType('daily')">日报</button>
        <button data-type="weekly" onclick="setType('weekly')">周报</button>
        <button data-type="monthly" onclick="setType('monthly')">月报</button>
      </div>
      <div id="reportTable"></div>
    </div>
    <div id="dashMsg"></div>
  </div>
</div>
<script>
const STORAGE = {
  token: 'xhs_member_token',
  username: 'xhs_member_username',
  profile: 'xhs_member_profile',
  reportType: 'xhs_member_report_type',
  activated: 'xhs_member_activated',
};

let library = { daily: [], weekly: [], monthly: [] };
let currentType = 'daily';

function loadStored(key) {
  try { return localStorage.getItem(key); } catch (_) { return null; }
}
function saveStored(key, val) {
  try { localStorage.setItem(key, val); } catch (_) {}
}
function removeStored(key) {
  try { localStorage.removeItem(key); } catch (_) {}
}

function saveSession(token, membership, username) {
  if (token) saveStored(STORAGE.token, token);
  if (username) saveStored(STORAGE.username, username);
  if (membership) saveStored(STORAGE.profile, JSON.stringify(membership));
  saveStored(STORAGE.activated, '1');
}

function loadCachedProfile() {
  try {
    const raw = loadStored(STORAGE.profile);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

function restoreFormFields() {
  const u = loadStored(STORAGE.username);
  if (u) {
    document.getElementById('loginUser').value = u;
    document.getElementById('regUser').value = u;
  }
}

function formatApiError(data, statusText) {
  if (typeof data.detail === 'string') return data.detail;
  if (Array.isArray(data.detail)) {
    return data.detail.map(e => e.msg || JSON.stringify(e)).join('；');
  }
  if (data.detail && typeof data.detail === 'object') {
    return JSON.stringify(data.detail);
  }
  return statusText || '请求失败';
}

function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.auth) {
    const t = loadStored(STORAGE.token);
    if (t) headers['Authorization'] = 'Bearer ' + t;
  }
  return fetch(path, { ...opts, headers }).then(async r => {
    const text = await r.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch (_) {}
    if (!r.ok) throw new Error(formatApiError(data, r.statusText));
    return data;
  });
}

function showMsg(el, text, kind) {
  el.innerHTML = text ? `<div class="alert alert-${kind}">${text}</div>` : '';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.getElementById('panelLogin').classList.toggle('hidden', name !== 'login');
  document.getElementById('panelRegister').classList.toggle('hidden', name !== 'register');
}

function fmtSize(n) {
  if (!n) return '-';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

function renderProfile(m) {
  if (!m) return;
  saveStored(STORAGE.profile, JSON.stringify(m));
  if (m.username) saveStored(STORAGE.username, m.username);

  document.getElementById('profileGrid').innerHTML = `
    <div class="profile-item"><div class="v">${esc(m.username)}</div><div class="l">用户名</div></div>
    <div class="profile-item"><div class="v">${esc(m.plan_label || m.plan_code)}</div><div class="l">套餐</div></div>
    <div class="profile-item"><div class="v">${m.days_remaining ?? '-'}</div><div class="l">剩余天数</div></div>
    <div class="profile-item"><div class="v" style="font-size:14px">${esc(m.expires_at)}</div><div class="l">到期时间</div></div>
  `;

  const chip = document.getElementById('welcomeChip');
  const nameEl = document.getElementById('welcomeName');
  if (m.username) {
    nameEl.textContent = m.username;
    chip.classList.remove('hidden');
  }

  const banner = document.getElementById('expiryBanner');
  if (m.expiry_warning) {
    const kind = (m.days_remaining ?? 99) <= 7 ? 'warn' : (m.is_active ? 'ok' : 'error');
    banner.innerHTML = `<div class="alert alert-${kind}">${esc(m.expiry_warning)}</div>`;
  } else if (m.is_active) {
    banner.innerHTML = `<div class="alert alert-ok">会员有效，可下载全部历史报告</div>`;
  } else {
    banner.innerHTML = '';
  }
}

function archiveTypeFor(t) {
  if (t === 'weekly') return 'member_weekly_zip';
  if (t === 'monthly') return 'member_monthly_zip';
  return 'member_daily_zip';
}

function renderReports() {
  const items = library[currentType] || [];
  const el = document.getElementById('reportTable');
  if (!items.length) {
    el.innerHTML = '<div class="empty">暂无报告，请等待系统生成或入库</div>';
    return;
  }
  const at = archiveTypeFor(currentType);
  let table = '<div class="report-table-wrap"><table><thead><tr><th>日期</th><th>说明</th><th>条数</th><th>大小</th><th></th></tr></thead><tbody>';
  let cards = '<div class="report-cards">';
  items.forEach(it => {
    const date = esc(it.report_date);
    const summary = esc(it.summary || it.file_name || '-');
    const rows = it.row_count ?? '-';
    const size = fmtSize(it.file_size_bytes);
    table += `<tr>
      <td>${date}</td><td>${summary}</td><td>${rows}</td><td>${size}</td>
      <td><button class="btn btn-primary" style="padding:8px 14px;font-size:13px;min-height:36px" onclick="downloadReport('${date}','${at}')">下载</button></td>
    </tr>`;
    cards += `<div class="report-card">
      <div class="rc-top"><span class="rc-date">${date}</span><button class="btn btn-primary" style="min-height:36px;padding:8px 16px;font-size:13px" onclick="downloadReport('${date}','${at}')">下载</button></div>
      <div class="rc-meta">${summary}<br>条数 ${rows} · ${size}</div>
    </div>`;
  });
  table += '</tbody></table></div>';
  cards += '</div>';
  el.innerHTML = table + cards;
}

function setType(t) {
  currentType = t;
  saveStored(STORAGE.reportType, t);
  document.querySelectorAll('#typeSeg button').forEach(b => b.classList.toggle('active', b.dataset.type === t));
  renderReports();
}

async function downloadReport(date, archiveType) {
  const dashMsg = document.getElementById('dashMsg');
  try {
    const t = loadStored(STORAGE.token);
    const r = await fetch(`/api/v1/member/reports/${encodeURIComponent(date)}/download?archive_type=${encodeURIComponent(archiveType)}`, {
      headers: { Authorization: 'Bearer ' + t }
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || '下载失败');
    }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = date + '.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    showMsg(dashMsg, '下载已开始：解压后请右键 index_with_gr.html，选择「打开方式」→ Google Chrome 打开（已支持手机自适应）', 'ok');
  } catch (e) {
    showMsg(dashMsg, e.message, 'error');
  }
}

function showDashboard(cachedProfile) {
  document.getElementById('authView').classList.add('hidden');
  document.getElementById('dashView').classList.remove('hidden');
  document.getElementById('btnLogout').classList.remove('hidden');
  if (cachedProfile) renderProfile(cachedProfile);
}

async function loadDashboard(useCacheFirst) {
  const cached = loadCachedProfile();
  if (useCacheFirst && cached) {
    showDashboard(cached);
  }
  const data = await api('/api/v1/member/library', { auth: true });
  renderProfile(data.membership || cached || {});
  library = data.library || { daily: [], weekly: [], monthly: [] };
  const savedType = loadStored(STORAGE.reportType);
  if (savedType && ['daily','weekly','monthly'].includes(savedType)) {
    currentType = savedType;
    document.querySelectorAll('#typeSeg button').forEach(b => {
      b.classList.toggle('active', b.dataset.type === savedType);
    });
  }
  renderReports();
  showDashboard(data.membership);
}

function logout() {
  removeStored(STORAGE.token);
  removeStored(STORAGE.profile);
  removeStored(STORAGE.activated);
  location.reload();
}

async function doLogin() {
  const authMsg = document.getElementById('authMsg');
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  try {
    const res = await api('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    saveSession(res.access_token, res.membership, username);
    await loadDashboard(false);
    showMsg(authMsg, '', 'ok');
  } catch (e) {
    showMsg(authMsg, e.message, 'error');
  }
}

async function doRegister() {
  const authMsg = document.getElementById('authMsg');
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const auth_code = document.getElementById('regCode').value.trim();
  try {
    const res = await api('/api/v1/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ auth_code, username, password })
    });
    saveSession(res.access_token, res.membership, username);
    document.getElementById('regCode').value = '';
    await loadDashboard(false);
    showMsg(authMsg, '', 'ok');
  } catch (e) {
    showMsg(authMsg, e.message, 'error');
  }
}

async function doRenew() {
  const dashMsg = document.getElementById('dashMsg');
  try {
    const res = await api('/api/v1/auth/activate', {
      method: 'POST',
      auth: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ auth_code: document.getElementById('renewCode').value.trim() })
    });
    renderProfile(res.membership || {});
    document.getElementById('renewCode').value = '';
    showMsg(dashMsg, res.message || '续费成功，会员状态已更新', 'ok');
  } catch (e) {
    showMsg(dashMsg, e.message, 'error');
  }
}

(async function init() {
  restoreFormFields();

  const token = loadStored(STORAGE.token);
  const activated = loadStored(STORAGE.activated);
  const cached = loadCachedProfile();

  if (activated && cached && !token) {
    const authMsg = document.getElementById('authMsg');
    showMsg(authMsg, `欢迎回来 ${cached.username || ''}，登录状态已过期，请输入密码重新登录（用户名已记住）`, 'warn');
    switchTab('login');
    return;
  }

  if (!token) return;

  try {
    await loadDashboard(true);
  } catch (e) {
    removeStored(STORAGE.token);
    const authMsg = document.getElementById('authMsg');
    if (cached) {
      renderProfile({ ...cached, is_active: false, expiry_warning: '登录已过期，请重新输入密码' });
      showMsg(authMsg, '会话已过期，用户名已保留，请重新登录', 'warn');
    }
  }
})();
</script>
</body>
</html>
