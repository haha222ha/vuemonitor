<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cursor 遥控</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --line: #2a3542;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9cf0;
      --ok: #7fd99a;
      --err: #f07178;
      --run: #e6c07b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0c1117;
      color: var(--text);
      font-size: 16px;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .device-row {
      margin: 10px 0 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .device-row label {
      font-size: 13px;
      color: var(--muted);
    }
    .device-row select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0c1117;
      color: var(--text);
      font-size: 16px;
    }
    .device-chip {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .list { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
    .st-pending { color: var(--muted); }
    .st-running { color: var(--run); }
    .st-done { color: var(--ok); }
    .st-error { color: var(--err); }
    .st-cancelled { color: #b8a0c8; }
    .btn-cancel {
      margin-top: 8px;
      width: auto;
      min-width: 88px;
      padding: 8px 14px;
      border-radius: 10px;
      background: transparent;
      color: var(--err);
      border: 1px solid #5a3038;
      font-weight: 600;
      font-size: 13px;
    }
    .btn-cancel:disabled { opacity: 0.45; }
    .prompt {
      margin: 8px 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }
    .result {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      color: #c9d4df;
      max-height: 280px;
      overflow: auto;
    }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: #243040; border: 1px solid var(--line);
      padding: 10px 14px; border-radius: 999px; font-size: 13px;
      display: none; z-index: 9;
    }
    .phase-banner {
      margin: 0 0 14px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #15202b;
    }
    .phase-banner .phase-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0 0 4px;
      line-height: 1.35;
    }
    .phase-banner .phase-action {
      font-size: 0.9rem;
      margin: 0 0 6px;
      color: var(--text);
    }
    .phase-banner .phase-meta {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      line-height: 1.4;
    }
    .phase-banner.ph-wait_user {
      border-color: #3d9cf0;
      background: linear-gradient(135deg, #15283a, #1a222c);
    }
    .phase-banner.ph-wait_user .phase-title { color: var(--accent); }
    .phase-banner.ph-task_running,
    .phase-banner.ph-auto_running {
      border-color: #8a7040;
      background: linear-gradient(135deg, #2a2418, #1a222c);
    }
    .phase-banner.ph-task_running .phase-title,
    .phase-banner.ph-auto_running .phase-title { color: var(--run); }
    .phase-banner.ph-idle {
      border-color: #2f5a40;
      background: linear-gradient(135deg, #15261c, #1a222c);
    }
    .phase-banner.ph-idle .phase-title { color: var(--ok); }
    .phase-banner.ph-offline,
    .phase-banner.ph-error {
      border-color: #6a3038;
      background: linear-gradient(135deg, #2a181c, #1a222c);
    }
    .phase-banner.ph-offline .phase-title,
    .phase-banner.ph-error .phase-title { color: var(--err); }
    .device-status-list {
      margin: 10px 0 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .device-status {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #121a22;
    }
    .device-status .ds-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .device-status .ds-name {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .device-status .ds-phase {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .device-status .ds-msg {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }
    .device-status .ds-meta {
      margin: 4px 0 0;
      font-size: 11px;
      color: #6f7f90;
    }
    .device-status.ds-idle .ds-phase { color: var(--ok); }
    .device-status.ds-task_running .ds-phase,
    .device-status.ds-auto_running .ds-phase { color: var(--run); }
    .device-status.ds-wait_user .ds-phase { color: var(--accent); }
    .device-status.ds-error .ds-phase,
    .device-status.ds-offline .ds-phase { color: var(--err); }
    .device-status.ds-offline { opacity: 0.72; }
    .device-status.is-focus {
      border-color: #3d6a90;
      box-shadow: inset 0 0 0 1px rgba(61, 156, 240, 0.18);
    }
    .input-panels {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .input-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .input-panel h2 {
      margin: 0 0 8px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .input-panel .panel-hint {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .voice-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .voice-row button {
      margin-top: 0;
      flex: 1;
    }
    button#voiceHold {
      background: #5b4bb8;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    button#voiceHold.is-listening {
      background: #c45c26;
      box-shadow: 0 0 0 2px rgba(196, 92, 38, 0.35);
    }
    button#voiceHeadset {
      flex: 0 0 auto;
      width: auto;
      min-width: 108px;
      padding: 12px 10px;
      background: #2a3542;
      font-weight: 600;
      font-size: 13px;
    }
    button#voiceHeadset.is-on {
      background: #2f5a40;
    }
    #voiceStatus {
      margin-top: 8px;
      min-height: 1.2em;
      font-size: 12px;
      color: var(--muted);
    }
    .input-panel .send-inline {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Cursor 遥控</h1>
  <p class="sub">多台电脑可同时挂机；提交时可指定设备 ID，或让任意在线机领取。</p>
  <div class="phase-banner ph-offline" id="phaseBanner" aria-live="polite">
    <p class="phase-title" id="phaseTitle">正在读取各机状态…</p>
    <p class="phase-action" id="phaseAction">请稍候</p>
    <p class="phase-meta" id="phaseMeta"></p>
    <div class="device-status-list" id="deviceStatusList"></div>
  </div>
  <div class="device-row">
    <label for="targetDevice">执行设备</label>
    <select id="targetDevice">
      <option value="">任意在线设备</option>
    </select>
    <div class="device-chip" id="deviceChip">设备列表加载中…</div>
  </div>

  <div class="input-panels">
    <section class="input-panel" id="panelText" aria-label="文字输入">
      <h2>文字输入</h2>
      <textarea id="prompt" placeholder="例如：总结今天热库增量情况，给 5 条要点"></textarea>
      <button id="send" class="send-inline" type="button">提交任务</button>
      <p class="panel-hint">独立模块 · 打字后点提交。</p>
    </section>
    <section class="input-panel" id="panelVoice" aria-label="语音输入">
      <h2>语音输入</h2>
      <div class="voice-row">
        <button id="voiceHold" type="button">开始识别</button>
        <button id="voiceHeadset" type="button" title="占用媒体会话，让蓝牙耳机播放键控制识别">启用耳机键</button>
      </div>
      <div id="voiceStatus">语音模块加载中…</div>
      <p class="panel-hint">屏幕：点「开始识别」→ 说 → 再点「结束识别」。耳机：先点「启用耳机键」，再用蓝牙耳机<strong>播放/暂停键</strong>切换开始/结束（与音乐 App 同逻辑）。建议手机 Chrome；微信内置浏览器多半无效。</p>
    </section>
  </div>
  <p class="hint">先选设备再提交。顶部可看<strong>每台电脑</strong>运行相位；列表可 <b>撤销</b>。设备 ID 在各机 worker 配置里。</p>
  <div class="list" id="list"></div>
  <div class="toast" id="toast"></div>
  <script src="input_text.js?v=2"></script>
  <script src="input_voice.js?v=3"></script>
  <script src="input_voice_headset.js?v=1"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const seenStatus = Object.create(null); // id -> last status
    let audioUnlocked = false;
    let audioCtx = null;

    function writeVoiceToBox(t) {
      const text = String(t || "").trim();
      if (!text) return false;
      try {
        if (textInput && typeof textInput.append === "function") {
          textInput.append(text);
          textInput.focus && textInput.focus();
          return true;
        }
      } catch (e) {
        console.warn("textInput.append", e);
      }
      const ta = $("prompt");
      if (!ta) return false;
      const cur = String(ta.value || "").trim();
      ta.value = cur ? cur + "\n" + text : text;
      try {
        ta.dispatchEvent(new Event("input", { bubbles: true }));
      } catch (_) {}
      try { ta.focus(); } catch (_) {}
      return true;
    }

    // —— 独立模块：文字 / 语音 / 耳机键 ——
    let textInput = null;
    let voiceInput = null;
    let headsetBridge = null;
    try {
      textInput = window.AgentTaskTextInput.mount({ textareaId: "prompt" });
    } catch (e) {
      console.warn(e);
    }
    try {
      if (window.AgentTaskVoiceInput && AgentTaskVoiceInput.isAvailable()) {
        voiceInput = AgentTaskVoiceInput.mount({
          buttonId: "voiceHold",
          statusId: "voiceStatus",
          onPartial: function () {},
          onFinal: function (t) {
            const ok = writeVoiceToBox(t);
            toast(ok ? "语音已写入文字框" : "写入失败，请手动复制状态栏文字");
            if (headsetBridge) headsetBridge.syncListening(false);
          },
          onError: function (msg) {
            if (msg && msg !== "unsupported") toast(String(msg));
          },
          onState: function (st) {
            if (headsetBridge) headsetBridge.syncListening(!!(st && st.listening));
          },
        });
      } else {
        $("voiceHold").disabled = true;
        $("voiceStatus").textContent = "本浏览器不支持语音识别，请用手机 Chrome（仍可用文字输入）";
      }
    } catch (e) {
      console.warn(e);
      $("voiceStatus").textContent = "语音模块初始化失败，请用文字输入";
    }

    // 蓝牙耳机播放键 ↔ 语音 toggle（Media Session，音乐 App 同款）
    try {
      const hsBtn = $("voiceHeadset");
      if (window.AgentTaskVoiceHeadset && AgentTaskVoiceHeadset.isAvailable() && voiceInput) {
        headsetBridge = AgentTaskVoiceHeadset.mount({
          getListening: function () {
            return !!(voiceInput && voiceInput.isListening && voiceInput.isListening());
          },
          onToggle: function () {
            unlockAudio();
            if (voiceInput && voiceInput.toggle) voiceInput.toggle();
            toast(
              voiceInput && voiceInput.isListening && voiceInput.isListening()
                ? "耳机键：开始识别"
                : "耳机键：结束识别"
            );
          },
          onError: function (msg) {
            if (msg === "unsupported") {
              hsBtn.disabled = true;
              hsBtn.textContent = "耳机键不可用";
            } else if (msg) toast(String(msg));
          },
          onState: function (st) {
            hsBtn.classList.toggle("is-on", !!(st && st.enabled));
            hsBtn.textContent = st && st.enabled ? "耳机键已开" : "启用耳机键";
          },
        });
        hsBtn.onclick = async function () {
          unlockAudio();
          if (headsetBridge.isEnabled()) {
            headsetBridge.disable();
            toast("已关闭耳机键控制");
            return;
          }
          const ok = await headsetBridge.enable();
          toast(ok ? "耳机键已启用：用播放/暂停键切换识别" : "启用失败，请用屏幕按钮");
        };
      } else if (hsBtn) {
        hsBtn.disabled = true;
        hsBtn.textContent = "耳机键不可用";
      }
    } catch (e) {
      console.warn(e);
      const hsBtn = $("voiceHeadset");
      if (hsBtn) {
        hsBtn.disabled = true;
        hsBtn.textContent = "耳机键不可用";
      }
    }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.style.display = "none"; }, 2200);
    }
    function unlockAudio() {
      if (audioUnlocked) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = audioCtx || new AC();
        if (audioCtx.state === "suspended") audioCtx.resume();
        // 极短静音解锁 iOS/Android 手势限制
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        g.gain.value = 0.0001;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.01);
        audioUnlocked = true;
      } catch (_) {}
    }
    /** 任务完成/失败提示音（浏览器端可听，含手机） */
    function playDoneChime(ok) {
      try {
        unlockAudio();
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = audioCtx || new AC();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const freqs = ok ? [880, 1174, 1568] : [392, 311];
        freqs.forEach((f, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = "sine";
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(0.18, now + 0.02 + i * 0.12);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.28 + i * 0.12);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(now + i * 0.12);
          o.stop(now + 0.35 + i * 0.12);
        });
      } catch (_) {}
    }
    function stClass(s) {
      if (s === "done") return "st-done";
      if (s === "error") return "st-error";
      if (s === "cancelled") return "st-cancelled";
      if (s === "running") return "st-running";
      return "st-pending";
    }
    function stLabel(s) {
      return ({
        pending: "排队中",
        running: "执行中",
        done: "完成",
        error: "失败",
        cancelled: "已撤销",
      })[s] || s;
    }
    function maybeNotify(tasks) {
      (tasks || []).forEach((t) => {
        const id = t.id || "";
        const st = t.status || "";
        const prev = seenStatus[id];
        if (prev && prev !== st && (st === "done" || st === "error" || st === "cancelled")) {
          playDoneChime(st === "done");
          toast(
            st === "done" ? "任务已完成 ✓"
              : st === "cancelled" ? "已撤销，worker 将继续下一单"
              : "任务失败"
          );
          try {
            if (navigator.vibrate) navigator.vibrate(st === "done" ? [40, 40, 80] : [120, 60, 120]);
          } catch (_) {}
        }
        if (id) seenStatus[id] = st;
      });
    }
    let _listFp = "";
    function listFingerprint(tasks) {
      return JSON.stringify((tasks || []).map((t) => [
        t.id, t.status, t.result || "", t.error || "", t.claimed_by || "", t.created_at || "",
        t.target_device_id || "", t.target_label || "",
      ]));
    }
    let _devices = [];
    function renderDeviceSelect(devices) {
      _devices = devices || [];
      const sel = $("targetDevice");
      const prev = sel.value;
      const online = _devices.filter((d) => d.online);
      const offline = _devices.filter((d) => !d.online);
      const opts = ['<option value="">任意在线设备</option>'];
      online.forEach((d) => {
        const lab = escapeHtml(d.label || d.device_id);
        const id = escapeHtml(d.device_id);
        opts.push(`<option value="${id}">🟢 ${lab}（${id}）</option>`);
      });
      offline.forEach((d) => {
        const lab = escapeHtml(d.label || d.device_id);
        const id = escapeHtml(d.device_id);
        opts.push(`<option value="${id}">⚪ ${lab}（离线·${id}）</option>`);
      });
      sel.innerHTML = opts.join("");
      if (prev && [...sel.options].some((o) => o.value === prev)) sel.value = prev;
      $("deviceChip").textContent =
        `在线 ${online.length}/${_devices.length}` +
        (online.length ? " · " + online.map((d) => d.label || d.device_id).join("、") : " · 请启动电脑 worker");
    }
    function render(tasks) {
      const box = $("list");
      const fp = listFingerprint(tasks);
      // 内容完全没变则禁止整表重绘，否则会把 .result / 页面滚动位清零
      if (fp === _listFp && box.childElementCount) return;
      const winY = window.scrollY || 0;
      const scrollById = Object.create(null);
      box.querySelectorAll(".card[data-tid] .result").forEach((el) => {
        const id = el.closest(".card").getAttribute("data-tid") || "";
        if (id) scrollById[id] = el.scrollTop;
      });
      if (!tasks.length) {
        _listFp = fp;
        box.innerHTML = '<div class="card"><div class="meta">暂无任务</div></div>';
        return;
      }
      box.innerHTML = tasks.map((t) => {
        const body = t.status === "error"
          ? (t.error || t.result || "")
          : t.status === "cancelled"
            ? (t.result || t.error || "已撤销")
            : (t.result || (t.status === "running" ? "本机 Cursor 执行中（RPA 粘贴后写结果文件）…" : (t.status === "pending" ? "等待本机 worker 领取…" : "")));
        const who = t.claimed_by ? ` · 领取 ${t.claimed_by}` : "";
        const tgt = t.target_device_id
          ? ` · 指定 ${t.target_label || t.target_device_id}`
          : " · 任意设备";
        const tid = escapeHtml(t.id || "");
        const canCancel = t.status === "pending" || t.status === "running";
        const cancelBtn = canCancel
          ? `<button type="button" class="btn-cancel" data-cancel="${tid}">撤销</button>`
          : "";
        return `<div class="card" data-tid="${tid}">
          <div class="meta">
            <span class="${stClass(t.status)}">${stLabel(t.status)}</span>
            <span>${t.created_at || ""} · ${t.id}${tgt}${who}</span>
          </div>
          <div class="prompt">${escapeHtml(t.prompt || "")}</div>
          ${body ? `<div class="result">${escapeHtml(body)}</div>` : ""}
          ${cancelBtn}
        </div>`;
      }).join("");
      _listFp = fp;
      box.querySelectorAll(".card[data-tid] .result").forEach((el) => {
        const id = el.closest(".card").getAttribute("data-tid") || "";
        if (id && scrollById[id] != null) el.scrollTop = scrollById[id];
      });
      if (winY > 0) window.scrollTo(0, winY);
    }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function phaseShort(p) {
      return ({
        idle: "空闲",
        task_running: "执行中",
        auto_running: "自动续跑",
        wait_user: "本向收口",
        error: "出错",
        offline: "离线",
      })[p] || p || "?";
    }
    function renderDeviceStatuses(devices, worker) {
      const box = $("deviceStatusList");
      if (!box) return;
      const list = devices || [];
      if (!list.length) {
        box.innerHTML = '<div class="device-status ds-offline"><div class="ds-top"><span class="ds-name">尚无登记设备</span><span class="ds-phase">离线</span></div><p class="ds-msg">各机启动 worker 并上报后，这里会并列显示每台状态。</p></div>';
        return;
      }
      const focusId = (worker && (worker.focus_device_id || worker.worker_id)) || "";
      box.innerHTML = list.map((d) => {
        const phase = d.online ? (d.phase || "idle") : "offline";
        const name = escapeHtml(d.label || d.device_id || "设备");
        const id = escapeHtml(d.device_id || "");
        const pl = escapeHtml(d.phase_label || phaseShort(phase));
        const msg = escapeHtml(d.message || d.hint || "");
        const bits = [];
        if (d.task_id) bits.push("任务 " + d.task_id);
        if (d.chain) bits.push("续跑第 " + d.chain + " 步");
        if (d.updated_at) bits.push(d.updated_at);
        if (d.hostname) bits.push(d.hostname);
        const focus = focusId && d.device_id === focusId ? " is-focus" : "";
        return `<div class="device-status ds-${escapeHtml(phase)}${focus}" data-device="${id}">
          <div class="ds-top"><span class="ds-name">${name}</span><span class="ds-phase">${pl}</span></div>
          ${msg ? `<p class="ds-msg">${msg}</p>` : ""}
          ${bits.length ? `<p class="ds-meta">${escapeHtml(bits.join(" · "))}</p>` : ""}
        </div>`;
      }).join("");
    }
    function renderPhase(w, devices) {
      const banner = $("phaseBanner");
      const phase = (w && w.phase) || "offline";
      banner.className = "phase-banner ph-" + phase;
      let title = (w && (w.title || w.message)) || "设备状态未知";
      let action = (w && w.phone_action) || "";
      // 旧文案纠偏：wait_user ≠ 等你输入；有备注「空闲队列」就不要手发下一条
      if (phase === "wait_user") {
        const bad =
          /等待你|等你输入|输入下一条|请下达|请在遥控/.test(title) ||
          title === "阶段完成" ||
          title === "本阶段完成";
        if (bad) {
          title = "本方向收口；空闲队列将自动推下一刀（无需你输入）";
        }
        if (/下达|输入|请发|下一条/.test(action)) {
          action = "无需操作·不要发下一条·队列自动续";
        }
        if (!action) action = "无需操作·不要发下一条·队列自动续";
      }
      $("phaseTitle").textContent = title;
      const onlineN = (w && w.online_n != null) ? w.online_n : ((devices || []).filter((d) => d.online).length);
      const others = (w && w.others_brief) ? ("其它：" + w.others_brief) : "";
      const actionBits = [];
      if (action) actionBits.push(action);
      if (onlineN > 1) actionBits.push("在线 " + onlineN + " 台（下方逐台）");
      if (others) actionBits.push(others);
      $("phaseAction").textContent = actionBits.join(" · ");
      const bits = [];
      if (w && w.focus_label) bits.push("焦点 " + w.focus_label);
      if (w && w.hint) bits.push(w.hint);
      if (w && w.task_id) bits.push("任务 " + w.task_id);
      if (w && w.chain) bits.push("自动续跑第 " + w.chain + " 步");
      if (w && w.updated_at) bits.push("更新 " + w.updated_at);
      $("phaseMeta").textContent = bits.join(" · ");
      renderDeviceStatuses(devices || _devices || [], w || {});
    }
    async function loadPhase() {
      try {
        const r = await fetch("/api/v1/agent-task/worker-status", { credentials: "same-origin" });
        if (r.status === 401) {
          location.href = "/agent-task/?e=1";
          return;
        }
        const j = await r.json();
        if (j.devices) renderDeviceSelect(j.devices);
        renderPhase(j.worker || {}, j.devices || _devices || []);
      } catch (_) {
        renderPhase({
          phase: "offline",
          title: "状态拉取失败",
          phone_action: "请检查网络后刷新",
        }, _devices || []);
      }
    }
    async function loadDevices() {
      try {
        const r = await fetch("/api/v1/agent-task/devices", { credentials: "same-origin" });
        if (r.status === 401) return;
        const j = await r.json();
        renderDeviceSelect(j.devices || []);
      } catch (_) {}
    }
    async function loadList() {
      const r = await fetch("/api/v1/agent-task/list?limit=20", { credentials: "same-origin" });
      if (r.status === 401) {
        location.href = "/agent-task/?e=1";
        return;
      }
      const j = await r.json();
      const tasks = j.tasks || [];
      maybeNotify(tasks);
      render(tasks);
      loadPhase();
    }
    $("list").addEventListener("click", async (ev) => {
      const btn = ev.target && ev.target.closest ? ev.target.closest("[data-cancel]") : null;
      if (!btn) return;
      const tid = btn.getAttribute("data-cancel") || "";
      if (!tid) return;
      if (!confirm("撤销该任务？执行中将停止等落盘，worker 去领下一单。")) return;
      btn.disabled = true;
      try {
        const r = await fetch("/api/v1/agent-task/" + encodeURIComponent(tid) + "/cancel", {
          method: "POST",
          credentials: "same-origin",
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) {
          toast(j.detail || j.error || ("撤销失败 " + r.status));
          btn.disabled = false;
          return;
        }
        toast("已撤销 " + tid);
        _listFp = "";
        loadList();
      } catch (e) {
        toast(String(e));
        btn.disabled = false;
      }
    });
    $("send").onclick = async () => {
      unlockAudio();
      const prompt = textInput
        ? textInput.getText()
        : ($("prompt").value || "").trim();
      if (!prompt) { toast("请输入任务"); return; }
      const target_device_id = ($("targetDevice").value || "").trim();
      const opt = $("targetDevice").selectedOptions[0];
      let target_label = "";
      if (target_device_id && opt) {
        target_label = String(opt.textContent || "")
          .replace(/^.\s*/, "")
          .replace(/（.*$/, "")
          .trim();
      }
      $("send").disabled = true;
      try {
        const r = await fetch("/api/v1/agent-task/submit", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, target_device_id, target_label }),
        });
        const raw = await r.text();
        let j = {};
        try { j = raw ? JSON.parse(raw) : {}; } catch (_) { j = {}; }
        if (!r.ok || !j.ok) {
          let detail = j.detail || j.error;
          if (Array.isArray(detail)) {
            detail = detail.map((x) => (x && x.msg) || JSON.stringify(x)).join("; ");
          }
          if (!detail) {
            detail = ("提交失败 " + r.status + (raw ? (" · " + raw.slice(0, 160)) : ""));
          }
          toast(String(detail));
          return;
        }
        if (textInput) textInput.clear();
        else $("prompt").value = "";
        const where = target_device_id ? ("→ " + (target_label || target_device_id)) : "→ 任意设备";
        toast("已提交 " + (j.task && j.task.id) + " " + where);
        if (j.task && j.task.id) {
          const box = $("list");
          const tid = String(j.task.id);
          if (!box.querySelector(`.card[data-tid="${CSS.escape(tid)}"]`)) {
            const tgt = j.task.target_device_id
              ? ` · 指定 ${escapeHtml(j.task.target_label || j.task.target_device_id)}`
              : " · 任意设备";
            const head = `<div class="card" data-tid="${escapeHtml(tid)}">
              <div class="meta">
                <span class="${stClass(j.task.status || "pending")}">${stLabel(j.task.status || "pending")}</span>
                <span>${escapeHtml(j.task.created_at || "")} · ${escapeHtml(tid)}${tgt}</span>
              </div>
              <div class="prompt">${escapeHtml(j.task.prompt || "")}</div>
              <div class="result">等待目标设备 worker 领取…</div>
            </div>`;
            box.insertAdjacentHTML("afterbegin", head);
          }
          _listFp = "";
          seenStatus[tid] = j.task.status || "pending";
        }
        loadList();
      } catch (e) {
        toast(String(e));
      } finally {
        $("send").disabled = false;
      }
    };
    document.addEventListener("pointerdown", unlockAudio, { once: true });
    loadDevices();
    loadList();
    let _iv = setInterval(loadList, 2000);
    setInterval(async () => {
      try {
        const r = await fetch("/api/v1/agent-task/list?limit=5", { credentials: "same-origin" });
        const j = await r.json();
        const busy = (j.tasks || []).some((t) => t.status === "pending" || t.status === "running");
        clearInterval(_iv);
        // 有排队/执行时 1.5s 刷；空闲 4s（略快于旧 5s）
        _iv = setInterval(loadList, busy ? 1500 : 4000);
      } catch (_) {}
    }, 15000);
  </script>
</body>
