<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cursor 遥控</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --line: #2a3542;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9cf0;
      --ok: #7fd99a;
      --err: #f07178;
      --run: #e6c07b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0c1117;
      color: var(--text);
      font-size: 16px;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .list { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
    .st-pending { color: var(--muted); }
    .st-running { color: var(--run); }
    .st-done { color: var(--ok); }
    .st-error { color: var(--err); }
    .prompt {
      margin: 8px 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }
    .result {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      color: #c9d4df;
      max-height: 280px;
      overflow: auto;
    }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: #243040; border: 1px solid var(--line);
      padding: 10px 14px; border-radius: 999px; font-size: 13px;
      display: none; z-index: 9;
    }
  </style>
</head>
<body>
  <h1>Cursor 遥控</h1>
  <p class="sub">提交后由本机 worker 领取执行，结果回写到这里。</p>
  <textarea id="prompt" placeholder="例如：总结今天热库增量情况，给 5 条要点"></textarea>
  <button id="send" type="button">提交任务</button>
  <p class="hint">保持本机 worker 在跑。列表 <b>2 秒</b>刷新；排队超过约 1 分钟仍不变 → 看本机 worker 日志是否 SSL/领取失败。</p>
  <div class="list" id="list"></div>
  <div class="toast" id="toast"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const seenStatus = Object.create(null); // id -> last status
    let audioUnlocked = false;
    let audioCtx = null;

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.style.display = "none"; }, 2200);
    }
    function unlockAudio() {
      if (audioUnlocked) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = audioCtx || new AC();
        if (audioCtx.state === "suspended") audioCtx.resume();
        // 极短静音解锁 iOS/Android 手势限制
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        g.gain.value = 0.0001;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.01);
        audioUnlocked = true;
      } catch (_) {}
    }
    /** 任务完成/失败提示音（浏览器端可听，含手机） */
    function playDoneChime(ok) {
      try {
        unlockAudio();
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = audioCtx || new AC();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const freqs = ok ? [880, 1174, 1568] : [392, 311];
        freqs.forEach((f, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = "sine";
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(0.18, now + 0.02 + i * 0.12);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.28 + i * 0.12);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(now + i * 0.12);
          o.stop(now + 0.35 + i * 0.12);
        });
      } catch (_) {}
    }
    function stClass(s) {
      if (s === "done") return "st-done";
      if (s === "error") return "st-error";
      if (s === "running") return "st-running";
      return "st-pending";
    }
    function stLabel(s) {
      return ({ pending: "排队中", running: "执行中", done: "完成", error: "失败" })[s] || s;
    }
    function maybeNotify(tasks) {
      (tasks || []).forEach((t) => {
        const id = t.id || "";
        const st = t.status || "";
        const prev = seenStatus[id];
        if (prev && prev !== st && (st === "done" || st === "error")) {
          playDoneChime(st === "done");
          toast(st === "done" ? "任务已完成 ✓" : "任务失败");
          try {
            if (navigator.vibrate) navigator.vibrate(st === "done" ? [40, 40, 80] : [120, 60, 120]);
          } catch (_) {}
        }
        if (id) seenStatus[id] = st;
      });
    }
    let _listFp = "";
    function listFingerprint(tasks) {
      return JSON.stringify((tasks || []).map((t) => [
        t.id, t.status, t.result || "", t.error || "", t.claimed_by || "", t.created_at || "",
      ]));
    }
    function render(tasks) {
      const box = $("list");
      const fp = listFingerprint(tasks);
      // 内容完全没变则禁止整表重绘，否则会把 .result / 页面滚动位清零
      if (fp === _listFp && box.childElementCount) {
        // #region agent log
        fetch('http://127.0.0.1:7544/ingest/f49d850b-4afa-4d85-829a-671166a5072c',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'719bb1'},body:JSON.stringify({sessionId:'719bb1',runId:'post-fix',hypothesisId:'A',location:'agent_task/index.html:render-skip',message:'skip unchanged list render',data:{cards:box.childElementCount},timestamp:Date.now()})}).catch(()=>{});
        // #endregion
        return;
      }
      const winY = window.scrollY || 0;
      const scrollById = Object.create(null);
      box.querySelectorAll(".card[data-tid] .result").forEach((el) => {
        const id = el.closest(".card").getAttribute("data-tid") || "";
        if (id) scrollById[id] = el.scrollTop;
      });
      if (!tasks.length) {
        _listFp = fp;
        box.innerHTML = '<div class="card"><div class="meta">暂无任务</div></div>';
        return;
      }
      box.innerHTML = tasks.map((t) => {
        const body = t.status === "error"
          ? (t.error || t.result || "")
          : (t.result || (t.status === "running" ? "本机 Cursor 执行中（RPA 粘贴后写结果文件）…" : (t.status === "pending" ? "等待本机 worker 领取…" : "")));
        const who = t.claimed_by ? ` · ${t.claimed_by}` : "";
        const tid = escapeHtml(t.id || "");
        return `<div class="card" data-tid="${tid}">
          <div class="meta">
            <span class="${stClass(t.status)}">${stLabel(t.status)}</span>
            <span>${t.created_at || ""} · ${t.id}${who}</span>
          </div>
          <div class="prompt">${escapeHtml(t.prompt || "")}</div>
          ${body ? `<div class="result">${escapeHtml(body)}</div>` : ""}
        </div>`;
      }).join("");
      _listFp = fp;
      box.querySelectorAll(".card[data-tid] .result").forEach((el) => {
        const id = el.closest(".card").getAttribute("data-tid") || "";
        if (id && scrollById[id] != null) el.scrollTop = scrollById[id];
      });
      if (winY > 0) window.scrollTo(0, winY);
      // #region agent log
      fetch('http://127.0.0.1:7544/ingest/f49d850b-4afa-4d85-829a-671166a5072c',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'719bb1'},body:JSON.stringify({sessionId:'719bb1',runId:'post-fix',hypothesisId:'A',location:'agent_task/index.html:render',message:'full render with scroll restore',data:{n:tasks.length,restored:Object.keys(scrollById).length,winY},timestamp:Date.now()})}).catch(()=>{});
      // #endregion
    }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    async function loadList() {
      const r = await fetch("/api/v1/agent-task/list?limit=20", { credentials: "same-origin" });
      if (r.status === 401) {
        location.href = "/agent-task/?e=1";
        return;
      }
      const j = await r.json();
      const tasks = j.tasks || [];
      maybeNotify(tasks);
      render(tasks);
    }
    $("send").onclick = async () => {
      unlockAudio();
      const prompt = $("prompt").value.trim();
      if (!prompt) { toast("请输入任务"); return; }
      $("send").disabled = true;
      try {
        const r = await fetch("/api/v1/agent-task/submit", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) {
          toast(j.detail || j.error || ("提交失败 " + r.status));
          return;
        }
        $("prompt").value = "";
        toast("已提交 " + (j.task && j.task.id));
        await loadList();
      } catch (e) {
        toast(String(e));
      } finally {
        $("send").disabled = false;
      }
    };
    // 任意点击也解锁音频（方便只盯列表时）
    document.addEventListener("pointerdown", unlockAudio, { once: true });
    loadList();
    let _iv = setInterval(loadList, 2000);
    setInterval(async () => {
      try {
        const r = await fetch("/api/v1/agent-task/list?limit=5", { credentials: "same-origin" });
        const j = await r.json();
        const busy = (j.tasks || []).some((t) => t.status === "pending" || t.status === "running");
        clearInterval(_iv);
        _iv = setInterval(loadList, busy ? 2000 : 5000);
      } catch (_) {}
    }, 15000);
  </script>
</body>
</html>
