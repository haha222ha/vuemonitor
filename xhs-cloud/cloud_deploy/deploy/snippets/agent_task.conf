# Cursor 遥控台 — 禁止落到心象测 SPA
# include 到 monitor.xhs365.cn 的 server{}，且必须在心象测 catch-all / try_files 之前
# 业务在 xhs-cloud-api :8080（密码门 + /app/ + API）

location = /agent-task {
    return 301 /agent-task/;
}

location ^~ /agent-task/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Agent-Task "1" always;
}

location ^~ /api/v1/agent-task/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Agent-Task "api" always;
}
