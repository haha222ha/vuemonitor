# 增量商品库 · 渠道选品看板 — 禁止落到心象测 SPA
# include 到 monitor.xhs365.cn 的 server{}，且必须在心象测 catch-all / try_files 之前
# 业务在 xhs-cloud-api :8080（密码门 + /channel/board/ + upload API）

location = /channel {
    return 301 /channel/;
}

# 大包上传统一 128m（线上默认 1m→12m 会 413；选品报告整包≈37MB）
location ^~ /api/v1/sync/channel-board-upload {
    client_max_body_size 128m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_body_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
}

location ^~ /api/v1/sync/channel-cycle-report-upload {
    client_max_body_size 128m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_body_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
}

location ^~ /api/v1/sync/report-upload {
    client_max_body_size 128m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_body_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
}

location ^~ /api/v1/sync/upload-session {
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_body_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
}

location ^~ /api/v1/sync/channel-workbench-upload {
    client_max_body_size 64m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
}

location ^~ /channel/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Channel-Board "1" always;
}
