server {
    listen 80;
    server_name intel.xhs365.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name intel.xhs365.cn;

    ssl_certificate /etc/nginx/ssl/xhs365.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/xhs365.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/intel;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/reports/ {
        proxy_pass http://server:8000/static/reports/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}