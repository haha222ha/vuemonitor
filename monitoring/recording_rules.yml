groups:
  - name: vuemonitor_recording
    interval: 30s
    rules:
      - record: vuemonitor:http_requests:rate5m
        expr: rate(http_requests_total[5m])

      - record: vuemonitor:http_errors:rate5m
        expr: rate(http_requests_total{status=~"5.."}[5m])

      - record: vuemonitor:http_error_ratio:rate5m
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          /
          rate(http_requests_total[5m])

      - record: vuemonitor:http_latency:p95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))

      - record: vuemonitor:http_latency:p99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))

      - record: vuemonitor:http_latency:p50
        expr: histogram_quantile(0.50, rate(http_request_duration_seconds_bucket[5m]))

      - record: vuemonitor:db_pool_usage_ratio
        expr: db_pool_checked_out / db_pool_size

      - record: vuemonitor:availability:1h
        expr: |
          sum(rate(http_requests_total{status!~"5.."}[1h]))
          /
          sum(rate(http_requests_total[1h]))
