groups:
  - name: vuemonitor_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "95th percentile latency is {{ $value }}s"

      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }}"

      - alert: DatabaseConnectionPoolExhausted
        expr: pg_pool_active_connections / pg_pool_max_connections > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Active connections: {{ $value }}"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"

      - alert: ServiceDown
        expr: up{job="vuemonitor-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "VueMonitor server has been down for more than 1 minute"

      - alert: HighAlertEventRate
        expr: rate(alert_events_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High alert event rate"
          description: "Alert events rate is {{ $value }} per second"

      - alert: BackupFailed
        expr: backup_last_success_timestamp{job="db-backup"} < time() - 86400
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Database backup failed"
          description: "Last successful backup was more than 24 hours ago"

      - alert: RateLimitThrottling
        expr: rate(rate_limit_hits_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate limit throttling"
          description: "Rate limiting is affecting {{ $value }} requests/sec"

      - alert: AICallFailureRate
        expr: rate(ai_api_calls_total{status="error"}[10m]) / rate(ai_api_calls_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High AI API failure rate"
          description: "AI API failure rate is {{ $value | humanizePercentage }}"

      - alert: CollectionTaskBacklog
        expr: collect_tasks_pending > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Collection task backlog growing"
          description: "{{ $value }} tasks are pending"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk space is low"
          description: "Available disk space is {{ $value | humanizePercentage }}"
