server {
    listen 80;
    server_name www.xhs365.cn xhs365.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.xhs365.cn xhs365.cn;

    ssl_certificate /etc/nginx/ssl/xhs365.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/xhs365.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        root /opt/vuemonitor/web-user/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        sub_filter_once off;
        sub_filter '__CSP_NONCE__' $http_x_csp_nonce;
        sub_filter_types text/html;

        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        root /opt/vuemonitor/web-user/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_read_timeout 86400;
    }

    location ^~ /downloads/ {
        alias /opt/vuemonitor/deploy/downloads/;
        autoindex off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /updates/ {
        alias /opt/vuemonitor/deploy/downloads/;
        autoindex off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Type "text/yaml";
    }
}

server {
    listen 80;
    server_name admin.xhs365.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
