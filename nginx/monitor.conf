# 选品会员看板 — 反代 xhs-cloud :8080（勿指向 web-admin）
# 安装:
#   sudo cp /opt/vuemonitor/nginx/monitor.conf /etc/nginx/sites-available/monitor.conf
#   sudo ln -sf /etc/nginx/sites-available/monitor.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare DNS: monitor → 服务器 IP（Flexible 模式，源站仅 HTTP 80）

upstream xhs_monitor_api {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name monitor.xhs365.cn;

    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Cloudflare Flexible：浏览器可能走 http，与 https 的 localStorage 不互通
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://xhs_monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
