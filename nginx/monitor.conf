# 选品会员看板 — 反代 xhs-cloud :8080（勿指向 web-admin）
# 安装: bash /opt/vuemonitor/xhs-cloud/cloud_deploy/scripts/ensure_nginx_insight_limits.sh

upstream xhs_monitor_api {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name monitor.xhs365.cn;

    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # 仅 POST generate 限流（读 library/radar/view 不限流）
    location = /api/v1/member/insight/generate {
        limit_req zone=insight_generate burst=5 nodelay;
        proxy_pass http://xhs_monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://xhs_monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
