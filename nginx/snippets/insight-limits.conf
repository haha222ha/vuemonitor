# 在 nginx.conf 的 http { } 块内 include:
#   include /etc/nginx/snippets/insight-limits.conf;
#
# Cloudflare 后必须用真实客户端 IP 做限流键，否则全员共享 10r/m → 503

map $http_cf_connecting_ip $insight_limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

map $http_cf_connecting_ip $member_login_limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# 单用户约 60 次/分钟；Tab 加载 library+radar+view 约 3 次
limit_req_zone $insight_limit_key zone=insight_api:10m rate=60r/m;
limit_req_zone $member_login_limit_key zone=member_login:10m rate=10r/m;

# 超限返回 429 而非 503，避免与 upstream 宕机混淆
limit_req_status 429;
