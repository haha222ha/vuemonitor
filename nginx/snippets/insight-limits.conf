# 在 nginx.conf 的 http { } 块内 include:
#   include /etc/nginx/snippets/insight-limits.conf;
#
# 仅对 POST /generate 限流；library/radar/view 只读接口不限流（避免 CF 共用 IP 503）

map $http_cf_connecting_ip $insight_limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# 生成接口：每真实 IP 约 10 次/分钟
limit_req_zone $insight_limit_key zone=insight_generate:10m rate=10r/m;
limit_req_status 429;
