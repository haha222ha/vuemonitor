# www.xhs365.cn — 对外 SaaS 货架（反代 xhs-cloud :8080）
# 货架静态：/saas/ ；公开目录：/api/v1/public/apps
# Plan A：/hub 与 /api/v1/public/internal-apps 源站返回 404

upstream xhs_www_api {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name www.xhs365.cn xhs365.cn;

    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        proxy_pass http://xhs_www_api/saas/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://xhs_www_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
