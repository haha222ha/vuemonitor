<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>考研入门条件检查清单[清单]</title>
<style>
  @page { size: A4; margin: 12mm 10mm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    color: #1E3A5F; background: #fff;
    max-width: 190mm; margin: 0 auto; padding: 0;
  }

  .header {
    background: linear-gradient(135deg, #1E3A5F, #1E3A5FDD);
    color: #fff; padding: 28px 32px; border-radius: 12px 12px 0 0;
  }
  .header h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: 1px; }
  .header .sub { font-size: 15px; opacity: 0.9; }
  .header .meta { font-size: 12px; opacity: 0.65; margin-top: 8px; }

  .content { padding: 28px 32px; }

  /* 统计条 */
  .stats-bar {
    display: flex; align-items: center; gap: 16px;
    background: #F8F9FA; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 24px;
    border: 1px solid #D4A84322;
  }
  .stats-bar .count {
    font-size: 42px; font-weight: 700; color: #D4A843;
    line-height: 1; min-width: 70px; text-align: center;
  }
  .stats-bar .label { font-size: 13px; color: #888; }
  .stats-bar .divider-stats { width: 1px; height: 40px; background: #ddd; }
  .stats-bar .progress-wrap { flex: 1; }
  .stats-bar .progress-bar {
    height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-bottom: 6px;
  }
  .stats-bar .progress-fill {
    height: 100%; border-radius: 5px; transition: width 0.4s ease;
    background: linear-gradient(90deg, #DC2626, #D97706, #059669);
  }

  /* 检查项 */
  .checklist { margin-bottom: 20px; }
  .check-item {
    display: flex; align-items: center; padding: 14px 16px;
    border-bottom: 1px solid #f0f0f0; cursor: pointer;
    transition: background 0.15s; border-radius: 8px;
  }
  .check-item:hover { background: #F8F9FA; }
  .check-item.checked { background: #05966908; }

  .check-box {
    width: 24px; height: 24px; border: 2px solid #ccc; border-radius: 6px;
    margin-right: 14px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; transition: all 0.2s;
    font-size: 16px; color: transparent;
  }
  .check-item.checked .check-box {
    background: #D4A843; border-color: #D4A843; color: #fff;
  }
  .check-item .check-label {
    font-size: 15px; flex: 1; line-height: 1.5;
  }
  .check-item .check-type {
    font-size: 11px; color: #999; margin-left: 10px; flex-shrink: 0;
  }

  /* 结果卡片 */
  .result-card {
    background: linear-gradient(135deg, #F8F9FA, #fff);
    border: 2px solid #D4A84333; border-radius: 14px;
    padding: 24px 28px; transition: all 0.3s;
  }
  .result-card.active { border-color: #D4A843; }
  .result-card .rec-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .result-card .rec-desc { font-size: 14px; color: #666; line-height: 1.6; }

  .footer {
    text-align: center; padding: 16px 32px; font-size: 11px;
    color: #aaa; border-top: 1px solid #eee;
  }
  .footer .disclaimer { margin-top: 4px; font-size: 10px; opacity: 0.7; }

  @media print {
    body { max-width: 100%; }
    .header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .check-item { cursor: default; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>考研入门条件检查清单[清单]</h1>
  <div class="sub">15项硬性+软性+加分条件，勾选评估考研准备度</div>
  <div class="meta">考研决策 · ¥6.9 · 产品ID: B20260522001-003</div>
</div>

<div class="content">

  <div class="stats-bar">
    <div>
      <div class="count" id="checkedCount">0</div>
      <div class="label">已勾选</div>
    </div>
    <div class="divider-stats"></div>
    <div>
      <div class="count" style="color:#888;" id="totalCount">15</div>
      <div class="label">总条件</div>
    </div>
    <div class="divider-stats"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
      <div class="label" id="matchLabel">开始勾选条件查看匹配结果</div>
    </div>
  </div>

  <div class="checklist" id="checklistContainer">
    <!-- 由JS动态生成 -->
  </div>

  <div class="result-card" id="resultCard">
    <div class="rec-title" id="resultTitle">—</div>
    <div class="rec-desc" id="resultDesc">勾选上方条件后，系统自动评估你的匹配程度。</div>
  </div>

</div>

<div class="footer">
  <div>B20260522001-003 · AI决策工具工厂 · 考研决策</div>
  <div class="disclaimer">⚠️ 本工具仅供个人参考，不构成专业建议。最终决策请结合自身实际情况判断。</div>
</div>

<script>
// 条件项数据（灌装时替换）
const checklistItems = [
  '本科在读或已毕业（含自考/成考）', '目标报考专业无限制（如法硕不要求法学本科）', '报考时间不在工作/出国等其他计划冲突期', '近1年内无重大生活变动计划（搬家/结婚等）', '每天能稳定抽出2小时以上复习时间',
  '对报考专业有基本了解和兴趣', '能坚持6个月以上的长期备考', '有一定自学习惯和经验', '有家人支持脱产或半脱产备考', '有一定考研预算（资料+报名费用约2000+）',
  '有稳定的学习环境（图书馆/自习室/安静房间）', '参加过至少1次标准化考试（四六级/教资等）', '已加入至少1个考研信息群或关注考研博主', '有至少1个考研搭子或学习伙伴', '已整理出意向院校的招生简章和报录比数据'
].filter(item => item && !item.startsWith('{{'));

// 匹配规则
const MATCH_RULES = {
  high: { min: 12, title: '🔵 高匹配度', desc: '你满足绝大多数硬性和软性条件，当前路径非常适合你的情况，建议坚定执行。' },
  mid:  { min: 8,  title: '🟡 中等匹配',  desc: '你满足部分条件，但仍有提升空间。建议针对未勾选的条件做补充准备后再继续。' },
  low:  { min: 0,  title: '🔴 低匹配度', desc: '你目前满足的条件较少，当前路径可能存在较大风险和挑战。建议重新评估或调整方向。' }
};

// 构建DOM
const container = document.getElementById('checklistContainer');
const types = ['硬性条件', '硬性条件', '硬性条件', '硬性条件', '软性条件',
               '软性条件', '软性条件', '软性条件', '软性条件', '加分项',
               '加分项', '加分项', '加分项', '加分项', '加分项'];

checklistItems.forEach((item, idx) => {
  const div = document.createElement('div');
  div.className = 'check-item';
  div.onclick = function() { toggleCheck(this); };
  div.innerHTML = `
    <div class="check-box">✓</div>
    <div class="check-label">${item}</div>
    <div class="check-type">${types[idx] || ''}</div>
  `;
  container.appendChild(div);
});

document.getElementById('totalCount').textContent = checklistItems.length;

function toggleCheck(el) {
  el.classList.toggle('checked');
  updateStats();
}

function updateStats() {
  const checked = document.querySelectorAll('.check-item.checked').length;
  const total = checklistItems.length;
  const pct = total > 0 ? Math.round(checked / total * 100) : 0;

  document.getElementById('checkedCount').textContent = checked;
  document.getElementById('progressFill').style.width = pct + '%';

  // 匹配判定
  let rule = MATCH_RULES.low;
  if (checked >= MATCH_RULES.high.min) rule = MATCH_RULES.high;
  else if (checked >= MATCH_RULES.mid.min) rule = MATCH_RULES.mid;

  document.getElementById('matchLabel').textContent = `${checked}/${total} 已勾选 (${pct}%)`;
  document.getElementById('resultTitle').textContent = rule.title;
  document.getElementById('resultDesc').textContent = rule.desc;
  document.getElementById('resultCard').classList.add('active');
}
</script>

</body>
</html>
