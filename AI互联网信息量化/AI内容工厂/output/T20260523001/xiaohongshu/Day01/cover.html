<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1440px; overflow:hidden;
  font-family:-apple-system,'PingFang SC',sans-serif;
  background:#0a0a1a; color:#fff; position:relative; }
.bg-glow { position:absolute; width:600px; height:600px;
  border-radius:50%; filter:blur(120px); opacity:0.15; }
.glow1 { top:-200px; right:-100px; background:#E11D48; }
.glow2 { bottom:-200px; left:-100px; background:#3b82f6; }
.container { position:relative; z-index:1; padding:80px 72px;
  height:100%; display:flex; flex-direction:column; }
.tag-row { display:flex; gap:12px; margin-bottom:40px; }
.tag { background:rgba(225,29,72,0.15); border:1px solid rgba(225,29,72,0.3);
  color:#E11D48; padding:8px 20px; border-radius:24px;
  font-size:22px; font-weight:600; }
.main-hook { margin-bottom:48px; }
.main-hook h1 { font-size:72px; font-weight:900; line-height:1.15; }
.main-hook h1 span { color:#E11D48; }
.main-hook .sub { font-size:28px; color:rgba(255,255,255,0.6); }
.sticker { display:inline-block; background:rgba(225,29,72,0.9);
  color:#fff; padding:10px 24px; border-radius:8px;
  font-size:24px; font-weight:700; margin-bottom:48px; }
.evidence-cards { display:grid; grid-template-columns:1fr 1fr;
  gap:24px; margin-bottom:48px; }
.evidence-card { background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px; padding:32px; backdrop-filter:blur(10px); }
.evidence-card .label { font-size:18px; color:rgba(255,255,255,0.5);
  margin-bottom:12px; }
.evidence-card .value { font-size:48px; font-weight:900; margin-bottom:8px; }
.evidence-card .value.red { color:#E11D48; }
.evidence-card .value.green { color:#22c55e; }
.evidence-card .desc { font-size:18px; color:rgba(255,255,255,0.7); }
.charts { display:grid; grid-template-columns:1fr 1fr;
  gap:24px; margin-bottom:48px; }
.chart-box { background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:16px; text-align:center; }
.chart-box img { max-width:100%; height:auto; }
.action-hint { background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:12px; padding:24px 32px; margin-top:auto; }
.action-hint .hint-label { font-size:16px; color:rgba(255,255,255,0.4);
  margin-bottom:8px; }
.action-hint .hint-text { font-size:26px; font-weight:700; }
.action-hint .hint-text span { color:#E11D48; }
</style>
</head>
