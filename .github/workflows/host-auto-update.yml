name: Host Auto Update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH host-update
    runs-on: ubuntu-latest
    if: github.repository == 'haha222ha/vuemonitor' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/vuemonitor
            sudo rm -rf client/node_modules 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            bash scripts/host-update.sh
            bash scripts/verify_production.sh || true
            cd server && source .venv/bin/activate
            export PYTHONPATH=/opt/vuemonitor/server
            python ../scripts/e2e_api_flow.py --base-url http://127.0.0.1:8000 --skip-ai || true

      - name: Secrets missing hint
        if: failure()
        run: |
          echo "Configure GitHub repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY"
          echo "Or run manually on host: bash /opt/vuemonitor/scripts/host-update.sh"
