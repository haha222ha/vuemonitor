version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=vuemonitor
      - DB_USER=saas_user
    secrets:
      - db_password
      - redis_password
      - jwt_secret
      - jwt_refresh_secret
      - encryption_key
    volumes:
      - ./server/app:/app/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vuemonitor
      POSTGRES_USER: saas_user
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d vuemonitor"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-backup:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: saas_user
      PGDATABASE: vuemonitor
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
    secrets:
      - db_password
      - backup_encryption_key
    volumes:
      - backup_data:/backups
    entrypoint: >
      /bin/sh -c "
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
          pg_dump -Fc $$PGDATABASE | \
            openssl enc -aes-256-cbc -salt -pbkdf2 -pass file:/run/secrets/backup_encryption_key > /backups/vuemonitor_$$TIMESTAMP.dump.enc;
          echo 'Encrypted backup created: vuemonitor_$$TIMESTAMP.dump.enc';
          find /backups -name '*.dump.enc' -mtime +7 -delete;
          echo 'Cleaned backups older than 7 days';
          sleep 86400;
        done
      "
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
  backup_encryption_key:
    file: ./secrets/backup_encryption_key.txt

volumes:
  postgres_data:
  redis_data:
  backup_data:
