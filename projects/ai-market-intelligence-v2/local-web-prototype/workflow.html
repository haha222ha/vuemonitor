<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>决策工作流 · 实验室</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="lab-shared.css">
</head>
<body>
<div class="app" style="max-width:1100px">
  <header>
    <h1>决策工作流</h1>
    <p style="color:var(--muted);font-size:13px;margin:0">想法 → AI 初评 → 验证 → 上架/放弃 → 复盘 · 本地 JSON 持久化</p>
  </header>
  <div id="labNav"></div>

  <section class="card">
    <h2>新建卡片</h2>
    <form id="addForm" class="add-card-form">
      <input id="cardTitle" placeholder="项目标题，如：美甲 summer 款" required>
      <select id="cardCategory">
        <option value="">关联类目（可选）</option>
      </select>
      <select id="cardColumn">
        <option value="idea">想法</option>
      </select>
      <button type="submit" class="btn primary">添加</button>
    </form>
    <div id="msg" class="msg"></div>
  </section>

  <div id="kanban" class="kanban"></div>
</div>
<script type="module" src="workflow.js"></script>
</body>
</html>
