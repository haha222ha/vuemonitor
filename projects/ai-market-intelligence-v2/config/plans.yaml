# V2 会员套餐 — 与 payment_plans_v2_patch.py / entitlements_v2 字段对齐

plans:
  insight_monthly:
    display: AI 选品情报
    price_label: "¥129/月"
    product_line: v2
    entitlements:
      insight_categories_per_day: 3
      insight_compare: false
      insight_timeline_days: 0
      insight_workflow: false
      insight_pdf_export: false
      insight_llm_tokens_per_day: 20000

  insight_pro_monthly:
    display: AI 选品情报 Pro
    price_label: "¥299/月"
    product_line: v2
    recommended: true
    entitlements:
      insight_categories_per_day: 5
      insight_compare: true
      insight_timeline_days: 30
      insight_workflow: true
      insight_pdf_export: true
      insight_llm_tokens_per_day: 40000

  insight_team_monthly:
    display: AI 选品情报 团队版
    price_label: "¥899/月"
    product_line: v2
    entitlements:
      insight_categories_per_day: 20
      insight_compare: true
      insight_timeline_days: 30
      insight_workflow: true
      insight_pdf_export: true
      insight_team_seats: 5
